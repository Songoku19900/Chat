<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2ff;
    color: #222;
}

/* =========================
   CONNEXION
========================= */

#connexion {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.boite-connexion {
    background: white;
    padding: 30px;
    width: 100%;
    max-width: 400px;
    border-radius: 18px;
    box-shadow: 0 8px 30px #0002;
    text-align: center;
}

.logo {
    font-size: 45px;
}

h1 {
    color: #4f46e5;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
    margin-top: 12px;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 15px;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.btn-principal {
    width: 100%;
    margin-top: 15px;
    background: #4f46e5;
    color: white;
    font-weight: bold;
}

.btn-secondaire {
    width: 100%;
    background: #e0e7ff;
    color: #3730a3;
    margin-top: 10px;
}

#erreur {
    color: #dc2626;
    margin-top: 15px;
}

#succes {
    color: #16a34a;
    margin-top: 15px;
}

/* =========================
   APPLICATION
========================= */

#application {
    display: none;
    min-height: 100vh;
}

header {
    height: 65px;
    background: #4f46e5;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
}

header h2 {
    margin: 0;
}

#btnDeconnexion {
    background: white;
    color: #4f46e5;
}

/* =========================
   STRUCTURE
========================= */

.conteneur {
    display: flex;
    height: calc(100vh - 65px);
}

/* =========================
   MENU
========================= */

.menu {
    width: 230px;
    background: white;
    padding: 20px;
    border-right: 1px solid #ddd;
}

.menu button {
    display: block;
    width: 100%;
    text-align: left;
    margin-bottom: 10px;
    background: #f1f5f9;
}

.menu button:hover {
    background: #e0e7ff;
}

.menu p {
    color: #64748b;
}

/* =========================
   DISCUSSION
========================= */

.discussion {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.titre-discussion {
    background: white;
    padding: 20px;
    border-bottom: 1px solid #ddd;
}

.titre-discussion h2 {
    margin: 0;
}

#listeMessages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

/* =========================
   MESSAGES
========================= */

.message {
    background: white;
    padding: 12px 15px;
    border-radius: 12px;
    margin-bottom: 12px;
    max-width: 75%;
    box-shadow: 0 2px 5px #0001;
}

.message .nom {
    font-weight: bold;
    color: #4f46e5;
    margin-bottom: 5px;
}

.message .texte {
    overflow-wrap: anywhere;
}

.message .date {
    font-size: 11px;
    color: #888;
    margin-top: 6px;
}

/* =========================
   ENVOI
========================= */

.zone-envoi {
    display: flex;
    gap: 10px;
    background: white;
    padding: 15px;
    border-top: 1px solid #ddd;
}

#message {
    flex: 1;
    min-width: 0;
}

#btnEnvoyer {
    background: #4f46e5;
    color: white;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 650px) {

    .menu {
        width: 70px;
        padding: 10px;
    }

    .menu button {
        font-size: 0;
        text-align: center;
    }

    .menu button::first-letter {
        font-size: 22px;
    }

    .menu p {
        display: none;
    }

    header {
        padding: 0 12px;
    }

    header h2 {
        font-size: 20px;
    }

    .message {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<!-- =========================
     CONNEXION / INSCRIPTION
========================= -->

<section id="connexion">

    <div class="boite-connexion">

        <div class="logo">💬</div>

        <h1>Bienvenue sur Chat</h1>

        <p>
            Connecte-toi avec ton pseudo et ton code.
        </p>

        <input
            type="text"
            id="pseudo"
            placeholder="Ton pseudo"
            maxlength="20"
            autocomplete="username"
        >

        <input
            type="password"
            id="motDePasse"
            placeholder="Ton code secret"
            maxlength="50"
            autocomplete="current-password"
        >

        <button
            class="btn-principal"
            id="btnConnexion"
        >
            Se connecter
        </button>

        <button
            class="btn-secondaire"
            id="btnInscription"
        >
            Créer un compte
        </button>

        <p id="erreur"></p>

        <p id="succes"></p>

    </div>

</section>


<!-- =========================
     APPLICATION
========================= -->

<section id="application">

    <header>

        <h2>💬 Chat</h2>

        <button id="btnDeconnexion">
            Se déconnecter
        </button>

    </header>

    <div class="conteneur">

        <aside class="menu">

            <p>MENU</p>

            <button id="btnAccueil">
                🏠 Accueil
            </button>

            <button id="btnDiscussion">
                💬 Discussion
            </button>

            <button id="btnAmis">
                👥 Amis
            </button>

            <p>Connecté en tant que :</p>

            <strong id="monPseudo"></strong>

        </aside>


        <main class="discussion">

            <div class="titre-discussion">

                <h2 id="titrePage">
                    💬 Discussion générale
                </h2>

                <p id="descriptionPage">
                    Parle avec tes potes.
                </p>

            </div>


            <div id="listeMessages">

                <p>Chargement des messages...</p>

            </div>


            <div class="zone-envoi">

                <input
                    type="text"
                    id="message"
                    placeholder="Écris un message..."
                    maxlength="500"
                    autocomplete="off"
                >

                <button id="btnEnvoyer">
                    Envoyer
                </button>

            </div>

        </main>

    </div>

</section>


<script>
/* ==========================================
   CONFIGURATION SUPABASE
========================================== */

const SUPABASE_URL =
    "https://dlzmbyvclmlgohmecuui.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_qd9EbA110P3SerFO3iq2iQ_cAgPzzGi";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==========================================
   VARIABLES
========================================== */

let utilisateur = null;
let pseudoActuel = "";
let canalMessages = null;


/* ==========================================
   ELEMENTS HTML
========================================== */

const connexion =
    document.getElementById("connexion");

const application =
    document.getElementById("application");

const inputPseudo =
    document.getElementById("pseudo");

const inputMotDePasse =
    document.getElementById("motDePasse");

const erreur =
    document.getElementById("erreur");

const succes =
    document.getElementById("succes");

const monPseudo =
    document.getElementById("monPseudo");

const listeMessages =
    document.getElementById("listeMessages");

const inputMessage =
    document.getElementById("message");

const btnConnexion =
    document.getElementById("btnConnexion");

const btnInscription =
    document.getElementById("btnInscription");

const btnEnvoyer =
    document.getElementById("btnEnvoyer");

const titrePage =
    document.getElementById("titrePage");

const descriptionPage =
    document.getElementById("descriptionPage");


/* ==========================================
   MESSAGES
========================================== */

function afficherErreur(message) {
    erreur.textContent = message;
    succes.textContent = "";
}

function afficherSucces(message) {
    succes.textContent = message;
    erreur.textContent = "";
}


/* ==========================================
   VERIFICATIONS
========================================== */

function verifierPseudo(pseudo) {
    return /^[a-zA-Z0-9_]{3,20}$/.test(pseudo);
}

function verifierCode(code) {
    return code.length >= 6;
}


/* ==========================================
   CREATION DE COMPTE
========================================== */

btnInscription.addEventListener(
    "click",
    inscrire
);

async function inscrire() {

    afficherErreur("");
    afficherSucces("");

    const pseudo =
        inputPseudo.value.trim();

    const code =
        inputMotDePasse.value;

    if (!verifierPseudo(pseudo)) {

        afficherErreur(
            "Le pseudo doit contenir 3 à 20 caractères : lettres, chiffres ou _."
        );

        return;
    }

    if (!verifierCode(code)) {

        afficherErreur(
            "Le code doit contenir au moins 6 caractères."
        );

        return;
    }

    btnInscription.disabled = true;

    afficherSucces("Création du compte...");

    /*
       On vérifie si le pseudo existe déjà.
    */

    const { data: profilExistant, error: erreurRecherche } =
        await client
            .from("profils")
            .select("id")
            .eq("pseudo", pseudo)
            .maybeSingle();

    if (erreurRecherche) {

        afficherErreur(
            "Erreur de vérification : " +
            erreurRecherche.message
        );

        console.error(erreurRecherche);

        btnInscription.disabled = false;

        return;
    }

    if (profilExistant) {

        afficherErreur(
            "Ce pseudo est déjà utilisé."
        );

        btnInscription.disabled = false;

        return;
    }

    /*
       Création d'un identifiant unique.
    */

    const nouvelId =
        crypto.randomUUID();

    const { data: nouveauProfil, error } =
        await client
            .from("profils")
            .insert({
                id: nouvelId,
                pseudo: pseudo,
                code: code
            })
            .select()
            .single();

    if (error) {

        afficherErreur(
            "Erreur lors de la création : " +
            error.message
        );

        console.error(error);

        btnInscription.disabled = false;

        return;
    }

    afficherSucces(
        "Compte créé ! Tu peux maintenant te connecter."
    );

    inputMotDePasse.value = "";

    btnInscription.disabled = false;
}


/* ==========================================
   CONNEXION
========================================== */

btnConnexion.addEventListener(
    "click",
    connecter
);

inputMotDePasse.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            connecter();
        }

    }
);

async function connecter() {

    afficherErreur("");
    afficherSucces("");

    const pseudo =
        inputPseudo.value.trim();

    const code =
        inputMotDePasse.value;

    if (!verifierPseudo(pseudo)) {

        afficherErreur("Pseudo invalide.");

        return;
    }

    if (!code) {

        afficherErreur(
            "Entre ton code secret."
        );

        return;
    }

    btnConnexion.disabled = true;

    afficherSucces("Connexion...");

    const { data: profil, error } =
        await client
            .from("profils")
            .select("*")
            .eq("pseudo", pseudo)
            .eq("code", code)
            .maybeSingle();

    if (error) {

        afficherErreur(
            "Erreur de connexion : " +
            error.message
        );

        console.error(error);

        btnConnexion.disabled = false;

        return;
    }

    if (!profil) {

        afficherErreur(
            "Pseudo ou code incorrect."
        );

        btnConnexion.disabled = false;

        return;
    }

    ouvrirApplication(profil);

    btnConnexion.disabled = false;
}


/* ==========================================
   OUVRIR L'APPLICATION
========================================== */

function ouvrirApplication(profil) {

    utilisateur = profil;
    pseudoActuel = profil.pseudo;

    /*
       On ne sauvegarde pas le code dans le navigateur.
    */

    localStorage.setItem(
        "compte_chat",
        JSON.stringify({
            id: profil.id,
            pseudo: profil.pseudo
        })
    );

    monPseudo.textContent =
        "@" + pseudoActuel;

    connexion.style.display = "none";
    application.style.display = "block";

    afficherDiscussion();

    ecouterMessages();
}


/* ==========================================
   CHARGER LES MESSAGES
========================================== */

async function chargerMessages() {

    listeMessages.innerHTML =
        "<p>Chargement des messages...</p>";

    const { data, error } =
        await client
            .from("messages")
            .select("*")
            .order("date_envoi", {
                ascending: true
            })
            .limit(100);

    if (error) {

        listeMessages.innerHTML =
            "<p>Impossible de charger les messages.</p>";

        console.error(error);

        return;
    }

    listeMessages.innerHTML = "";

    if (!data || data.length === 0) {

        listeMessages.innerHTML =
            "<p>Aucun message pour le moment.</p>";

        return;
    }

    data.forEach(afficherMessage);

    allerEnBas();
}


/* ==========================================
   AFFICHER UN MESSAGE
========================================== */

function afficherMessage(message) {

    const bloc =
        document.createElement("div");

    bloc.className = "message";

    const nom =
        document.createElement("div");

    nom.className = "nom";

    nom.textContent =
        "@" + message.pseudo;

    const texte =
        document.createElement("div");

    texte.className = "texte";

    texte.textContent =
        message.contenu;

    const date =
        document.createElement("div");

    date.className = "date";

    date.textContent =
        new Date(
            message.date_envoi
        ).toLocaleString("fr-FR");

    bloc.appendChild(nom);
    bloc.appendChild(texte);
    bloc.appendChild(date);

    listeMessages.appendChild(bloc);
}


/* ==========================================
   ENVOYER UN MESSAGE
========================================== */

btnEnvoyer.addEventListener(
    "click",
    envoyerMessage
);

inputMessage.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            envoyerMessage();
        }

    }
);

async function envoyerMessage() {

    const contenu =
        inputMessage.value.trim();

    if (!contenu) {
        return;
    }

    if (!utilisateur) {
        return;
    }

    btnEnvoyer.disabled = true;

    const { error } =
        await client
            .from("messages")
            .insert({
                utilisateur_id: utilisateur.id,
                pseudo: pseudoActuel,
                contenu: contenu
            });

    if (error) {

        alert(
            "Impossible d'envoyer le message : " +
            error.message
        );

        console.error(error);

    } else {

        inputMessage.value = "";

    }

    btnEnvoyer.disabled = false;
}


/* ==========================================
   TEMPS REEL
========================================== */

function ecouterMessages() {

    if (canalMessages) {
        return;
    }

    canalMessages =
        client
            .channel("nouveaux-messages")
            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "messages"
                },
                function(payload) {

                    afficherMessage(payload.new);
                    allerEnBas();

                }
            )
            .subscribe();
}


/* ==========================================
   DESCENDRE EN BAS
========================================== */

function allerEnBas() {

    listeMessages.scrollTop =
        listeMessages.scrollHeight;
}


/* ==========================================
   MENU ACCUEIL
========================================== */

document.getElementById("btnAccueil")
    .addEventListener(
        "click",
        function() {

            titrePage.textContent =
                "🏠 Accueil";

            descriptionPage.textContent =
                "Bienvenue sur Chat !";

            listeMessages.innerHTML =
                "<p>Bienvenue sur ton espace Chat.</p>";

            document.querySelector(
                ".zone-envoi"
            ).style.display = "none";

        }
    );


/* ==========================================
   MENU DISCUSSION
========================================== */

document.getElementById("btnDiscussion")
    .addEventListener(
        "click",
        function() {

            afficherDiscussion();

        }
    );

async function afficherDiscussion() {

    titrePage.textContent =
        "💬 Discussion générale";

    descriptionPage.textContent =
        "Parle avec tes potes.";

    document.querySelector(
        ".zone-envoi"
    ).style.display = "flex";

    await chargerMessages();

    allerEnBas();
}


/* ==========================================
   MENU AMIS
========================================== */

document.getElementById("btnAmis")
    .addEventListener(
        "click",
        function() {

            titrePage.textContent =
                "👥 Amis";

            descriptionPage.textContent =
                "Tes amis sur Chat.";

            listeMessages.innerHTML =
                "<p>La fonctionnalité Amis sera ajoutée prochainement.</p>";

            document.querySelector(
                ".zone-envoi"
            ).style.display = "none";

        }
    );


/* ==========================================
   DECONNEXION
========================================== */

document.getElementById("btnDeconnexion")
    .addEventListener(
        "click",
        async function() {

            if (canalMessages) {

                await client.removeChannel(
                    canalMessages
                );

                canalMessages = null;

            }

            utilisateur = null;
            pseudoActuel = "";

            localStorage.removeItem(
                "compte_chat"
            );

            application.style.display = "none";
            connexion.style.display = "flex";

            inputPseudo.value = "";
            inputMotDePasse.value = "";
            inputMessage.value = "";

            listeMessages.innerHTML = "";

            afficherErreur("");
            afficherSucces("");

        }
    );


/* ==========================================
   RECONNEXION AUTOMATIQUE
========================================== */

async function verifierConnexionSauvegardee() {

    const compteSauvegarde =
        localStorage.getItem("compte_chat");

    if (!compteSauvegarde) {
        return;
    }

    try {

        const compte =
            JSON.parse(compteSauvegarde);

        if (!compte.id || !compte.pseudo) {
            return;
        }

        /*
           On vérifie que le profil existe toujours.
        */

        const { data: profil, error } =
            await client
                .from("profils")
                .select("*")
                .eq("id", compte.id)
                .eq("pseudo", compte.pseudo)
                .maybeSingle();

        if (error || !profil) {

            localStorage.removeItem(
                "compte_chat"
            );

            return;
        }

        ouvrirApplication(profil);

    } catch (error) {

        localStorage.removeItem(
            "compte_chat"
        );

    }
}


/* ==========================================
   LANCEMENT
========================================== */

verifierConnexionSauvegardee();

</script>

</body>
</html>
