<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   VARIABLES
========================================================= */

:root {
    --primaire: #4f46e5;
    --primaire-hover: #4338ca;
    --primaire-clair: #eef2ff;

    --fond: #f5f7fb;
    --blanc: #ffffff;

    --texte: #1e293b;
    --texte-secondaire: #64748b;

    --bordure: #e2e8f0;

    --vert: #22c55e;
    --vert-clair: #ecfdf5;

    --gris: #94a3b8;

    --rouge: #dc2626;
    --rouge-clair: #fef2f2;

    --ombre: 0 4px 20px rgba(15, 23, 42, 0.07);
}


/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--fond);
    color: var(--texte);
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
    border: none;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}


/* =========================================================
   CONNEXION
========================================================= */

#connexion {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at top left,
            #e0e7ff,
            transparent 35%
        ),
        var(--fond);
}

.boite-connexion {
    width: 100%;
    max-width: 410px;

    padding: 35px;

    background: var(--blanc);

    border: 1px solid var(--bordure);
    border-radius: 22px;

    box-shadow: var(--ombre);

    text-align: center;
}

.logo-connexion {
    width: 72px;
    height: 72px;

    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--primaire-clair);

    border-radius: 20px;

    font-size: 36px;
}

.boite-connexion h1 {
    margin: 0;
    font-size: 28px;
}

.sous-titre {
    margin: 10px 0 25px;

    color: var(--texte-secondaire);

    line-height: 1.5;
}

.champ {
    width: 100%;

    padding: 14px 15px;

    margin-top: 12px;

    border: 1px solid var(--bordure);
    border-radius: 12px;

    outline: none;

    font-size: 15px;

    background: white;

    transition: 0.2s;
}

.champ:focus {
    border-color: var(--primaire);

    box-shadow:
        0 0 0 3px rgba(79, 70, 229, 0.1);
}

.btn-principal,
.btn-secondaire {
    width: 100%;

    padding: 13px 18px;

    margin-top: 12px;

    border-radius: 12px;

    font-size: 15px;
    font-weight: bold;

    transition: 0.2s;
}

.btn-principal {
    background: var(--primaire);
    color: white;
}

.btn-principal:hover {
    background: var(--primaire-hover);
}

.btn-secondaire {
    background: var(--primaire-clair);
    color: var(--primaire);
}

.btn-secondaire:hover {
    background: #e0e7ff;
}

#erreur {
    min-height: 20px;

    margin: 15px 0 0;

    color: var(--rouge);

    font-size: 14px;
}

#succes {
    min-height: 20px;

    margin: 15px 0 0;

    color: #16a34a;

    font-size: 14px;
}


/* =========================================================
   APPLICATION
========================================================= */

#application {
    display: none;

    min-height: 100vh;
}


/* =========================================================
   HEADER
========================================================= */

header {
    height: 68px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 24px;

    background: var(--blanc);

    border-bottom: 1px solid var(--bordure);
}

.logo-chat {
    display: flex;
    align-items: center;

    gap: 10px;

    font-size: 21px;
    font-weight: bold;
}

.logo-chat-icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--primaire);

    border-radius: 11px;

    color: white;
}

.btn-deconnexion {
    padding: 9px 14px;

    background: var(--rouge-clair);

    color: var(--rouge);

    border: 1px solid #fecaca;

    border-radius: 10px;

    font-weight: bold;
}

.btn-deconnexion:hover {
    background: #fee2e2;
}


/* =========================================================
   STRUCTURE
========================================================= */

.conteneur {
    display: flex;

    min-height: calc(100vh - 68px);
}


/* =========================================================
   MENU
========================================================= */

.menu {
    width: 240px;

    flex-shrink: 0;

    padding: 20px;

    background: var(--blanc);

    border-right: 1px solid var(--bordure);
}

.menu-titre {
    margin: 0 0 12px;

    color: var(--texte-secondaire);

    font-size: 12px;
    font-weight: bold;

    text-transform: uppercase;

    letter-spacing: 0.08em;
}

.menu button {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 10px;

    padding: 12px 13px;

    margin-bottom: 7px;

    background: transparent;

    color: var(--texte);

    border-radius: 11px;

    text-align: left;

    font-size: 14px;

    transition: 0.2s;
}

.menu button:hover,
.menu button.actif {
    background: var(--primaire-clair);

    color: var(--primaire);
}

.menu-separation {
    height: 1px;

    margin: 20px 0;

    background: var(--bordure);
}

.mon-compte {
    padding: 12px;

    background: #f8fafc;

    border: 1px solid var(--bordure);

    border-radius: 12px;
}

.mon-compte-label {
    margin-bottom: 5px;

    color: var(--texte-secondaire);

    font-size: 11px;
}

.mon-compte-pseudo {
    font-weight: bold;

    color: var(--primaire);

    overflow-wrap: anywhere;
}


/* =========================================================
   CONTENU
========================================================= */

.discussion {
    flex: 1;

    min-width: 0;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   TITRE
========================================================= */

.titre-discussion {
    padding: 24px 28px;

    background: var(--blanc);

    border-bottom: 1px solid var(--bordure);
}

.titre-discussion h2 {
    margin: 0;

    font-size: 22px;
}

.titre-discussion p {
    margin: 6px 0 0;

    color: var(--texte-secondaire);

    font-size: 14px;
}


/* =========================================================
   ZONE PRINCIPALE
========================================================= */

#listeMessages {
    flex: 1;

    overflow-y: auto;

    padding: 25px 28px;
}


/* =========================================================
   MESSAGE VIDE
========================================================= */

.message-vide {
    padding: 30px;

    background: var(--blanc);

    border: 1px dashed var(--bordure);

    border-radius: 14px;

    color: var(--texte-secondaire);

    text-align: center;
}


/* =========================================================
   ACCUEIL
========================================================= */

.accueil-entete {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;

    margin-bottom: 20px;
}

.accueil-entete h3 {
    margin: 0;

    font-size: 18px;
}

.compteur-connectes {
    padding: 7px 11px;

    background: var(--vert-clair);

    color: #15803d;

    border-radius: 20px;

    font-size: 13px;
    font-weight: bold;
}

.section-utilisateurs {
    margin-bottom: 28px;
}

.section-utilisateurs h3 {
    margin: 0 0 12px;

    font-size: 16px;
}

.grille-utilisateurs {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(260px, 1fr));

    gap: 14px;
}


/* =========================================================
   CARTE UTILISATEUR
========================================================= */

.carte-utilisateur {
    display: flex;
    align-items: center;

    gap: 12px;

    padding: 15px;

    background: var(--blanc);

    border: 1px solid var(--bordure);

    border-radius: 15px;

    box-shadow:
        0 2px 8px rgba(15, 23, 42, 0.04);

    transition: 0.2s;
}

.carte-utilisateur:hover {
    transform: translateY(-1px);

    box-shadow: var(--ombre);
}

.avatar-utilisateur {
    position: relative;

    width: 44px;
    height: 44px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--primaire-clair);

    color: var(--primaire);

    border-radius: 13px;

    font-size: 17px;
    font-weight: bold;
}

.point-en-ligne,
.point-hors-ligne {
    position: absolute;

    right: -2px;
    bottom: -2px;

    width: 13px;
    height: 13px;

    border: 3px solid white;

    border-radius: 50%;
}

.point-en-ligne {
    background: var(--vert);
}

.point-hors-ligne {
    background: var(--gris);
}

.infos-utilisateur {
    min-width: 0;

    flex: 1;
}

.nom-utilisateur {
    font-weight: bold;

    overflow-wrap: anywhere;
}

.statut-utilisateur {
    margin-top: 3px;

    color: var(--texte-secondaire);

    font-size: 12px;
}


/* =========================================================
   BOUTON PARLER
========================================================= */

.btn-parler {
    padding: 8px 11px;

    background: var(--primaire-clair);

    color: var(--primaire);

    border-radius: 9px;

    font-size: 12px;
    font-weight: bold;

    flex-shrink: 0;
}

.btn-parler:hover {
    background: #e0e7ff;
}


/* =========================================================
   DISCUSSION PUBLIQUE
========================================================= */

.message {
    width: fit-content;

    max-width: min(75%, 700px);

    padding: 13px 15px;

    margin-bottom: 12px;

    background: var(--blanc);

    border: 1px solid var(--bordure);

    border-radius: 14px;

    box-shadow:
        0 2px 5px rgba(15, 23, 42, 0.04);
}

.message .nom {
    margin-bottom: 5px;

    color: var(--primaire);

    font-weight: bold;
}

.message .texte {
    overflow-wrap: anywhere;

    line-height: 1.45;
}

.message .date {
    margin-top: 7px;

    color: var(--gris);

    font-size: 11px;
}


/* =========================================================
   CONVERSATION PRIVEE
========================================================= */

.en-tete-prive {
    display: flex;
    align-items: center;

    gap: 12px;

    margin-bottom: 20px;
}

.btn-retour {
    padding: 9px 12px;

    background: var(--primaire-clair);

    color: var(--primaire);

    border-radius: 10px;

    font-weight: bold;
}

.btn-retour:hover {
    background: #e0e7ff;
}

.info-prive {
    display: flex;
    flex-direction: column;
}

.info-prive-nom {
    font-weight: bold;

    font-size: 17px;
}

.info-prive-statut {
    margin-top: 3px;

    color: var(--texte-secondaire);

    font-size: 12px;
}


/* =========================================================
   MESSAGES PRIVES
========================================================= */

.message-prive {
    display: flex;

    margin-bottom: 12px;
}

.message-prive.moi {
    justify-content: flex-end;
}

.bulle-privee {
    max-width: min(75%, 600px);

    padding: 11px 14px;

    background: white;

    border: 1px solid var(--bordure);

    border-radius: 15px;
}

.message-prive.moi .bulle-privee {
    background: var(--primaire-clair);

    border-color: #c7d2fe;
}

.nom-prive {
    margin-bottom: 4px;

    color: var(--primaire);

    font-size: 12px;
    font-weight: bold;
}

.texte-prive {
    overflow-wrap: anywhere;

    line-height: 1.45;
}

.date-prive {
    margin-top: 6px;

    color: var(--gris);

    font-size: 10px;
}


/* =========================================================
   ZONE ENVOI
========================================================= */

.zone-envoi {
    display: flex;

    gap: 10px;

    padding: 15px 20px;

    background: var(--blanc);

    border-top: 1px solid var(--bordure);
}

#message {
    flex: 1;

    min-width: 0;

    margin: 0;
}

#btnEnvoyer {
    padding: 0 22px;

    background: var(--primaire);

    color: white;

    border-radius: 11px;

    font-weight: bold;
}

#btnEnvoyer:hover {
    background: var(--primaire-hover);
}

#btnVocal {
    width: 48px;
    min-width: 48px;
    padding: 0;
    background: #ef4444;
    color: white;
    border-radius: 11px;
    font-size: 20px;
}

#btnVocal:hover {
    filter: brightness(0.95);
}

#btnImage {
    width: 48px;
    min-width: 48px;
    padding: 0;
    background: #2563eb;
    color: white;
    border-radius: 11px;
    font-size: 20px;
}

#btnImage:hover {
    filter: brightness(0.95);
}

.image-privee {
    display: block;
    max-width: min(320px, 100%);
    max-height: 400px;
    margin-top: 5px;
    border-radius: 12px;
    object-fit: contain;
}


#btnVocal.enregistrement {
    background: #111827;
    animation: pulseVocal 1s infinite;
}

@keyframes pulseVocal {
    50% {
        transform: scale(1.06);
    }
}

#statutVocal {
    align-self: center;
    color: var(--texte-secondaire);
    font-size: 12px;
    min-width: 85px;
}

.audio-prive {
    width: min(280px, 100%);
    display: block;
    margin-top: 5px;
}


/* =========================================================
   RECHERCHE POTES
========================================================= */

.zone-recherche {
    margin-bottom: 20px;
}

#recherchePotes {
    margin: 0;
}


/* =========================================================
   BADGE EN LIGNE
========================================================= */

.badge-en-ligne {
    display: inline-block;

    margin-top: 5px;

    color: #16a34a;

    font-size: 12px;
}

.badge-hors-ligne {
    display: inline-block;

    margin-top: 5px;

    color: var(--gris);

    font-size: 12px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 750px) {

    header {
        padding: 0 14px;
    }

    .conteneur {
        min-height: calc(100vh - 68px);
    }

    .menu {
        width: 70px;

        padding: 12px 9px;
    }

    .menu-titre,
    .menu-separation,
    .mon-compte {
        display: none;
    }

    .menu button {
        justify-content: center;

        padding: 13px 8px;

        font-size: 0;
    }

    .menu button span {
        font-size: 22px;
    }

    .titre-discussion {
        padding: 18px;
    }

    #listeMessages {
        padding: 18px;
    }

    .zone-envoi {
        padding: 12px;
    }

    #btnEnvoyer {
        padding: 0 15px;
    }

    .message {
        max-width: 90%;
    }

    .bulle-privee {
        max-width: 90%;
    }

    .grille-utilisateurs {
        grid-template-columns: 1fr;
    }

    .btn-parler {
        padding: 8px;
    }
}


@media (max-width: 480px) {

    .boite-connexion {
        padding: 25px 20px;
    }

    .logo-chat-text {
        display: none;
    }

    .btn-deconnexion {
        font-size: 12px;
    }

    .accueil-entete {
        align-items: flex-start;

        flex-direction: column;
    }

}


/* =========================================================
   SCROLLBAR
========================================================= */

#listeMessages::-webkit-scrollbar {
    width: 8px;
}

#listeMessages::-webkit-scrollbar-thumb {
    background: #cbd5e1;

    border-radius: 10px;
}

</style>

</head>


<body>


<!-- ========================================================
     CONNEXION
========================================================= -->

<section id="connexion">

    <div class="boite-connexion">

        <div class="logo-connexion">
            💬
        </div>

        <h1>Bienvenue sur Chat</h1>

        <p class="sous-titre">
            Connecte-toi avec ton pseudo et ton code secret.
        </p>

        <input
            class="champ"
            type="text"
            id="pseudo"
            placeholder="Ton pseudo"
            maxlength="20"
            autocomplete="username"
        >

        <input
            class="champ"
            type="password"
            id="motDePasse"
            placeholder="Ton code secret"
            maxlength="50"
            autocomplete="current-password"
        >

        <button
            class="btn-principal"
            id="btnConnexion"
        >
            Se connecter
        </button>

        <button
            class="btn-secondaire"
            id="btnInscription"
        >
            Créer un compte
        </button>

        <p id="erreur"></p>

        <p id="succes"></p>

    </div>

</section>


<!-- ========================================================
     APPLICATION
========================================================= -->

<section id="application">

<header>

    <div class="logo-chat">

        <div class="logo-chat-icon">
            💬
        </div>

        <span class="logo-chat-text">
            Chat
        </span>

    </div>

    <button
        class="btn-deconnexion"
        id="btnDeconnexion"
    >
        Se déconnecter
    </button>

</header>


<div class="conteneur">


    <!-- =================================================
         MENU
    ================================================== -->

    <aside class="menu">

        <p class="menu-titre">
            Menu
        </p>


        <button
            id="btnAccueil"
            class="actif"
        >
            <span>🏠</span>
            <span>Accueil</span>
        </button>


        <button id="btnDiscussion">
            <span>💬</span>
            <span>Discussion</span>
        </button>


        <button id="btnAmis">
            <span>👥</span>
            <span>Potes</span>
        </button>


        <div class="menu-separation"></div>


        <div class="mon-compte">

            <div class="mon-compte-label">
                Connecté en tant que
            </div>

            <div
                class="mon-compte-pseudo"
                id="monPseudo"
            >
            </div>

        </div>

    </aside>


    <!-- =================================================
         CONTENU
    ================================================== -->

    <main class="discussion">


        <div class="titre-discussion">

            <h2 id="titrePage">
                🏠 Accueil
            </h2>

            <p id="descriptionPage">
                Bienvenue sur Chat !
            </p>

        </div>


        <div id="listeMessages">

            <div class="message-vide">
                Chargement...
            </div>

        </div>


        <div
            class="zone-envoi"
            id="zoneEnvoi"
            style="display: none;"
        >

            <input
                class="champ"
                type="text"
                id="message"
                placeholder="Écris un message..."
                maxlength="500"
                autocomplete="off"
            >

            <button
                id="btnVocal"
                title="Enregistrer un vocal"
                type="button"
            >
                🎙️
            </button>

            <button
                id="btnImage"
                title="Envoyer une image"
                type="button"
            >
                🖼️
            </button>

            <input
                type="file"
                id="inputImage"
                accept="image/*"
                style="display: none;"
            >

            <span id="statutVocal"></span>

            <button id="btnEnvoyer">
                Envoyer
            </button>

        </div>

    </main>

</div>

</section>


<script>

/* =========================================================
   CONFIGURATION SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://dlzmbyvclmlgohmecuui.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_qd9EbA110P3SerFO3iq2iQ_cAgPzzGi";


const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   VARIABLES
========================================================= */

let utilisateur = null;

let pseudoActuel = "";

let canalMessages = null;

let canalPresence = null;

let canalMessagesPrives = null;

let conversationActuelle = null;

let utilisateurPriveActuel = null;


/* =========================================================
   ELEMENTS
========================================================= */

const connexion =
    document.getElementById("connexion");

const application =
    document.getElementById("application");

const inputPseudo =
    document.getElementById("pseudo");

const inputMotDePasse =
    document.getElementById("motDePasse");

const erreur =
    document.getElementById("erreur");

const succes =
    document.getElementById("succes");

const monPseudo =
    document.getElementById("monPseudo");

const listeMessages =
    document.getElementById("listeMessages");

const inputMessage =
    document.getElementById("message");

const btnConnexion =
    document.getElementById("btnConnexion");

const btnInscription =
    document.getElementById("btnInscription");

const btnEnvoyer =
    document.getElementById("btnEnvoyer");

const btnVocal =
    document.getElementById("btnVocal");

const btnImage =
    document.getElementById("btnImage");

const inputImage =
    document.getElementById("inputImage");

const statutVocal =
    document.getElementById("statutVocal");

let mediaRecorder =
    null;

let morceauxVocal =
    [];

let enregistrementVocal =
    false;

const titrePage =
    document.getElementById("titrePage");

const descriptionPage =
    document.getElementById("descriptionPage");

const zoneEnvoi =
    document.getElementById("zoneEnvoi");

const btnAccueil =
    document.getElementById("btnAccueil");

const btnDiscussion =
    document.getElementById("btnDiscussion");

const btnAmis =
    document.getElementById("btnAmis");


/* =========================================================
   MESSAGES D'INFORMATION
========================================================= */

function afficherErreur(message) {

    erreur.textContent = message;

    succes.textContent = "";

}


function afficherSucces(message) {

    succes.textContent = message;

    erreur.textContent = "";

}


/* =========================================================
   VERIFICATIONS
========================================================= */

function verifierPseudo(pseudo) {

    return /^[a-zA-Z0-9_]{3,20}$/.test(pseudo);

}


function verifierCode(code) {

    return code.length >= 6;

}


/* =========================================================
   INSCRIPTION
========================================================= */

btnInscription.addEventListener(
    "click",
    inscrire
);


async function inscrire() {

    afficherErreur("");
    afficherSucces("");

    const pseudo =
        inputPseudo.value.trim();

    const code =
        inputMotDePasse.value;


    if (!verifierPseudo(pseudo)) {

        afficherErreur(
            "Le pseudo doit contenir 3 à 20 caractères : lettres, chiffres ou _."
        );

        return;
    }


    if (!verifierCode(code)) {

        afficherErreur(
            "Le code doit contenir au moins 6 caractères."
        );

        return;
    }


    btnInscription.disabled = true;

    afficherSucces(
        "Création du compte..."
    );


    const {
        data: profilExistant,
        error: erreurRecherche
    } = await client
        .from("profils")
        .select("id")
        .eq("pseudo", pseudo)
        .maybeSingle();


    if (erreurRecherche) {

        afficherErreur(
            "Erreur de vérification : " +
            erreurRecherche.message
        );

        console.error(erreurRecherche);

        btnInscription.disabled = false;

        return;
    }


    if (profilExistant) {

        afficherErreur(
            "Ce pseudo est déjà utilisé."
        );

        btnInscription.disabled = false;

        return;
    }


    const nouvelId =
        crypto.randomUUID();


    const {
        error
    } = await client
        .from("profils")
        .insert({

            id: nouvelId,

            pseudo: pseudo,

            code: code

        });


    if (error) {

        afficherErreur(
            "Erreur lors de la création : " +
            error.message
        );

        console.error(error);

        btnInscription.disabled = false;

        return;
    }


    afficherSucces(
        "Compte créé ! Tu peux maintenant te connecter."
    );


    inputMotDePasse.value = "";

    btnInscription.disabled = false;

}

/* =========================================================
   PRESENCE EN LIGNE / HORS LIGNE
========================================================= */

async function demarrerPresence() {

    if (!utilisateur) {
        return;
    }


    if (canalPresence) {

        await client.removeChannel(
            canalPresence
        );

        canalPresence = null;

    }


    canalPresence =
        client.channel(
            "presence-chat",
            {
                config: {

                    presence: {

                        key:
                            utilisateur.id

                    }

                }
            }
        );


    canalPresence.on(
        "presence",
        {
            event: "sync"
        },
        function() {

            if (
                titrePage.textContent.includes(
                    "Accueil"
                )
            ) {

                afficherUtilisateurs();

            }

        }
    );


    canalPresence.on(
        "presence",
        {
            event: "join"
        },
        function() {

            if (
                titrePage.textContent.includes(
                    "Accueil"
                )
            ) {

                afficherUtilisateurs();

            }

        }
    );


    canalPresence.on(
        "presence",
        {
            event: "leave"
        },
        function() {

            if (
                titrePage.textContent.includes(
                    "Accueil"
                )
            ) {

                afficherUtilisateurs();

            }

        }
    );


    canalPresence.subscribe(
        async function(status) {

            if (
                status === "SUBSCRIBED"
            ) {

                await canalPresence.track({

                    id:
                        utilisateur.id,

                    pseudo:
                        utilisateur.pseudo

                });


                afficherUtilisateurs();

            }

        }
    );

}


/* =========================================================
   RECUPERER LES IDS EN LIGNE
========================================================= */

function recupererIdsConnectes() {

    const ids =
        new Set();


    if (!canalPresence) {
        return ids;
    }


    const state =
        canalPresence.presenceState();


    Object.keys(state).forEach(
        function(key) {

            const presences =
                state[key];


            if (
                Array.isArray(presences)
            ) {

                presences.forEach(
                    function(presence) {

                        if (
                            presence.id
                        ) {

                            ids.add(
                                String(
                                    presence.id
                                )
                            );

                        }

                    }
                );

            }

        }
    );


    return ids;

}

/* =========================================================
   AFFICHER MESSAGE PUBLIC
========================================================= */

function afficherMessage(message) {

    const bloc = document.createElement("div");
    bloc.className = "message";

    const nom = document.createElement("div");
    nom.className = "nom";
    nom.textContent = "@" + message.pseudo;
    bloc.appendChild(nom);

    if (message.type_message === "image" && message.image_url) {
        const image = document.createElement("img");
        image.className = "image-privee";
        image.src = message.image_url;
        image.alt = "Image envoyée par @" + message.pseudo;
        image.loading = "lazy";
        image.style.cursor = "pointer";
        image.addEventListener("click", function() {
            window.open(message.image_url, "_blank");
        });
        bloc.appendChild(image);
    } else if (message.type_message === "vocal" && message.audio_url) {
        const audio = document.createElement("audio");
        audio.className = "audio-prive";
        audio.controls = true;
        audio.preload = "metadata";
        audio.src = message.audio_url;
        bloc.appendChild(audio);
    } else if (message.contenu) {
        const texte = document.createElement("div");
        texte.className = "texte";
        texte.textContent = message.contenu;
        bloc.appendChild(texte);
    }

    const date = document.createElement("div");
    date.className = "date";
    if (message.date_envoi) {
        date.textContent = new Date(message.date_envoi).toLocaleString("fr-FR");
    }
    bloc.appendChild(date);
    listeMessages.appendChild(bloc);
}

/* =========================================================
   TROUVER OU CREER CONVERSATION
========================================================= */

async function trouverOuCreerConversation(
    idUtilisateur1,
    idUtilisateur2
) {

    /*
       On cherche d'abord dans un sens.
    */

    let {
        data: conversation,
        error
    } = await client
        .from("conversations_privees")
        .select("*")
        .eq(
            "utilisateur1",
            idUtilisateur1
        )
        .eq(
            "utilisateur2",
            idUtilisateur2
        )
        .maybeSingle();


    if (error) {

        afficherErreurPrivee(
            error
        );

        return null;
    }


    if (conversation) {

        return conversation;

    }


    /*
       Puis dans l'autre sens.
    */

    const resultatInverse =
        await client
            .from("conversations_privees")
            .select("*")
            .eq(
                "utilisateur1",
                idUtilisateur2
            )
            .eq(
                "utilisateur2",
                idUtilisateur1
            )
            .maybeSingle();


    if (
        resultatInverse.error
    ) {

        afficherErreurPrivee(
            resultatInverse.error
        );

        return null;
    }


    if (
        resultatInverse.data
    ) {

        return resultatInverse.data;

    }


    /*
       Aucune conversation :
       on la crée.
    */

    const resultatCreation =
        await client
            .from("conversations_privees")
            .insert({

                utilisateur1:
                    idUtilisateur1,

                utilisateur2:
                    idUtilisateur2

            })
            .select()
            .single();


    if (
        resultatCreation.error
    ) {

        afficherErreurPrivee(
            resultatCreation.error
        );

        return null;
    }


    return resultatCreation.data;

}


/* =========================================================
   ERREUR PRIVEE
========================================================= */

function afficherErreurPrivee(
    error
) {

    console.error(error);


    listeMessages.innerHTML = `

            <strong>

            Vérifie que les tables
            <strong>conversations_privees</strong>
            et
            <strong>messages_prives</strong>

    `;

}

/* =========================================================
   CHARGER MESSAGES PRIVES
========================================================= */

async function chargerMessagesPrives(
    conversationId
) {

    const entete =
        document.querySelector(
            ".en-tete-prive"
        );


    const chargement =
        document.createElement("div");

    chargement.className =
        "message-vide";

    chargement.textContent =
        "Chargement des messages...";


    listeMessages.appendChild(
        chargement
    );


    const {
        data,
        error
    } = await client
        .from("messages_prives")
        .select("*")
        .eq(
            "conversation_id",
            conversationId
        )
        .order(
            "created_at",
            {
                ascending: true
            }
        )
        .limit(100);


    chargement.remove();


    if (error) {

        console.error(error);

        const erreurElement =
            document.createElement("div");

        erreurElement.className =
            "message-vide";

        erreurElement.textContent =
            "Impossible de charger les messages : " +
            error.message;


        listeMessages.appendChild(
            erreurElement
        );

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        const vide =
            document.createElement("div");

        vide.className =
            "message-vide";

        vide.textContent =
            "Aucun message. Commence la conversation !";


        listeMessages.appendChild(
            vide
        );

        return;
    }


    data.forEach(
        afficherMessagePrive
    );

}


/* =========================================================
   AFFICHER MESSAGE PRIVE
========================================================= */

function afficherMessagePrive(
    message
) {

    const bloc =
        document.createElement("div");


    const estMoi =
        String(message.pseudo) ===
        String(pseudoActuel);


    bloc.className =
        estMoi
            ? "message-prive moi"
            : "message-prive";


    const bulle =
        document.createElement("div");

    bulle.className =
        "bulle-privee";


    const nom =
        document.createElement("div");

    nom.className =
        "nom-prive";

    nom.textContent =
        "@" + message.pseudo;


    if (
        message.type_message === "image" &&
        message.image_url
    ) {

        const image =
            document.createElement("img");

        image.className =
            "image-privee";

        image.src =
            message.image_url;

        image.alt =
            "Image envoyée";

        image.loading =
            "lazy";

        image.addEventListener(
            "click",
            function() {
                window.open(
                    message.image_url,
                    "_blank"
                );
            }
        );

        image.style.cursor =
            "pointer";

        bulle.appendChild(
            image
        );

    } else if (
        message.type_message === "vocal" &&
        message.audio_url
    ) {

        const audio =
            document.createElement("audio");

        audio.className =
            "audio-prive";

        audio.controls =
            true;

        audio.preload =
            "metadata";

        audio.src =
            message.audio_url;

        bulle.appendChild(
            audio
        );

    } else {

        const texte =
            document.createElement("div");

        texte.className =
            "texte-prive";

        texte.textContent =
            message.texte || "";

        bulle.appendChild(
            texte
        );

    }


    const date =
        document.createElement("div");

    date.className =
        "date-prive";


    if (
        message.created_at
    ) {

        date.textContent =
            new Date(
                message.created_at
            ).toLocaleString(
                "fr-FR"
            );

    }


    bulle.appendChild(
        nom
    );

    bulle.appendChild(
        date
    );


    bloc.appendChild(
        bulle
    );


    listeMessages.appendChild(
        bloc
    );

}

/* =========================================================
   VOCAL PUBLIC
========================================================= */

async function envoyerVocalPublic(blob) {

    if (!utilisateur) return;

    try {
        const nomFichier =
            utilisateur.id + "/public-" + Date.now() + ".webm";

        const resultatUpload = await client
            .storage
            .from("vocaux")
            .upload(nomFichier, blob, {
                contentType: blob.type || "audio/webm",
                upsert: false
            });

        if (resultatUpload.error) throw resultatUpload.error;

        const resultatUrl = client
            .storage
            .from("vocaux")
            .getPublicUrl(nomFichier);

        const { error } = await client
            .from("messages")
            .insert({
                utilisateur_id: utilisateur.id,
                pseudo: pseudoActuel,
                contenu: "",
                type_message: "vocal",
                audio_url: resultatUrl.data.publicUrl
            });

        if (error) throw error;

        statutVocal.textContent = "Vocal envoyé";
        setTimeout(function() { statutVocal.textContent = ""; }, 1500);

    } catch (error) {
        console.error(error);
        statutVocal.textContent = "";
        alert("Impossible d'envoyer le vocal : " + error.message);
    }
}


/* =========================================================
   VOCAUX PRIVES
========================================================= */

async function demarrerOuArreterVocal() {

    if (enregistrementVocal) {

        if (mediaRecorder) {
            mediaRecorder.stop();
        }

        return;
    }

    if (!conversationActuelle && !utilisateur) {
        return;
    }

    if (conversationActuelle && !utilisateurPriveActuel) {
        alert("La conversation privée n'est plus disponible.");
        return;
    }

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia ||
        !window.MediaRecorder
    ) {
        alert("Ton navigateur ne permet pas l'enregistrement vocal.");
        return;
    }

    try {

        const flux =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        morceauxVocal = [];

        mediaRecorder =
            new MediaRecorder(flux);

        enregistrementVocal =
            true;

        btnVocal.classList.add(
            "enregistrement"
        );

        btnVocal.textContent =
            "⏹️";

        statutVocal.textContent =
            "Enregistrement...";

        mediaRecorder.ondataavailable =
            function(event) {

                if (event.data.size > 0) {
                    morceauxVocal.push(
                        event.data
                    );
                }

            };

        mediaRecorder.onstop =
            async function() {

                enregistrementVocal =
                    false;

                btnVocal.classList.remove(
                    "enregistrement"
                );

                btnVocal.textContent =
                    "🎙️";

                statutVocal.textContent =
                    "Envoi...";

                flux.getTracks().forEach(
                    function(track) {
                        track.stop();
                    }
                );

                const blob =
                    new Blob(
                        morceauxVocal,
                        {
                            type:
                                mediaRecorder.mimeType ||
                                "audio/webm"
                        }
                    );

                if (conversationActuelle) {
                    await envoyerVocalPrive(blob);
                } else {
                    await envoyerVocalPublic(blob);
                }

            };

        mediaRecorder.start();

    } catch (error) {

        console.error(error);

        statutVocal.textContent =
            "";

        alert(
            "Impossible d'utiliser le micro : " +
            error.message
        );

    }

}

/* =========================================================
   ENVOYER UNE IMAGE PRIVEE
========================================================= */

async function envoyerImagePrive(
    fichier
) {

    if (!utilisateur) {
        return;
    }

    if (conversationActuelle && !utilisateurPriveActuel) {
        alert("La conversation privée n'est plus disponible.");
        return;
    }

    if (!fichier) {
        return;
    }

    if (!fichier.type.startsWith("image/")) {
        alert("Choisis une image.");
        return;
    }

    const tailleMax =
        8 * 1024 * 1024;

    if (fichier.size > tailleMax) {
        alert("L'image est trop grande. Maximum : 8 Mo.");
        return;
    }

    btnImage.disabled = true;

    statutVocal.textContent =
        "Envoi de l'image...";

    if (!conversationActuelle) {
        try {
            const extension =
                (fichier.name.split(".").pop() || "jpg").toLowerCase();
            const nomFichier =
                utilisateur.id + "/public-" + Date.now() + "." + extension;

            const resultatUpload = await client
                .storage
                .from("images")
                .upload(nomFichier, fichier, {
                    contentType: fichier.type,
                    upsert: false
                });

            if (resultatUpload.error) throw resultatUpload.error;

            const resultatUrl = client
                .storage
                .from("images")
                .getPublicUrl(nomFichier);

            const { error } = await client
                .from("messages")
                .insert({
                    utilisateur_id: utilisateur.id,
                    pseudo: pseudoActuel,
                    contenu: "",
                    type_message: "image",
                    image_url: resultatUrl.data.publicUrl
                });

            if (error) throw error;

            statutVocal.textContent = "Image envoyée";
            setTimeout(function() { statutVocal.textContent = ""; }, 1500);
        } catch (error) {
            console.error(error);
            statutVocal.textContent = "";
            alert("Impossible d'envoyer l'image : " + error.message);
        } finally {
            btnImage.disabled = false;
            inputImage.value = "";
        }
        return;
    }

    const extension =
        (
            fichier.name.split(".").pop() ||
            "jpg"
        )
        .toLowerCase();

    const nomFichier =
        utilisateur.id +
        "/" +
        conversationActuelle.id +
        "-" +
        Date.now() +
        "." +
        extension;

    try {

        const resultatUpload =
            await client
                .storage
                .from("images")
                .upload(
                    nomFichier,
                    fichier,
                    {
                        contentType:
                            fichier.type,
                        upsert:
                            false
                    }
                );

        if (resultatUpload.error) {
            throw resultatUpload.error;
        }

        const resultatUrl =
            client
                .storage
                .from("images")
                .getPublicUrl(
                    nomFichier
                );

        const imageUrl =
            resultatUrl.data.publicUrl;

        const resultatMessage =
            await client
                .from("messages_prives")
                .insert({

                    conversation_id:
                        conversationActuelle.id,

                    auteur_id:
                        utilisateur.id,

                    pseudo:
                        pseudoActuel,

                    texte:
                        "",

                    type_message:
                        "image",

                    image_url:
                        imageUrl
                });

        if (resultatMessage.error) {
            throw resultatMessage.error;
        }

        statutVocal.textContent =
            "Image envoyée";

        setTimeout(
            function() {
                statutVocal.textContent =
                    "";
            },
            1500
        );

    } catch (error) {

        console.error(error);

        statutVocal.textContent =
            "";

        alert(
            "Impossible d'envoyer l'image : " +
            error.message
        );

    } finally {

        btnImage.disabled =
            false;

        inputImage.value =
            "";

    }

}

/* =========================================================
   TEMPS REEL MESSAGES PRIVES
========================================================= */

function ecouterMessagesPrives(
    conversationId
) {

    if (canalMessagesPrives) {

        client.removeChannel(
            canalMessagesPrives
        );

        canalMessagesPrives =
            null;

    }


    canalMessagesPrives =
        client
            .channel(
                "conversation-privee-" +
                conversationId
            )
            .on(
                "postgres_changes",
                {

                    event: "INSERT",

                    schema: "public",

                    table: "messages_prives",

                    filter:
                        "conversation_id=eq." +
                        conversationId

                },
                function(payload) {

                    if (
                        conversationActuelle &&
                        String(
                            conversationActuelle.id
                        ) ===
                        String(
                            conversationId
                        )
                    ) {

                        afficherMessagePrive(
                            payload.new
                        );

                        allerEnBas();

                    }

                }
            )
            .subscribe();

}


/* =========================================================
   FERMER CONVERSATION PRIVEE
========================================================= */

function fermerConversationPrivee() {

    conversationActuelle =
        null;

    utilisateurPriveActuel =
        null;


    if (
        canalMessagesPrives
    ) {

        client.removeChannel(
            canalMessagesPrives
        );

        canalMessagesPrives =
            null;

    }

}


/* =========================================================
   BOUTON ACTIF
========================================================= */

function changerBoutonActif(
    bouton
) {

    btnAccueil.classList.remove(
        "actif"
    );

    btnDiscussion.classList.remove(
        "actif"
    );

    btnAmis.classList.remove(
        "actif"
    );


    if (bouton) {

        bouton.classList.add(
            "actif"
        );

    }

}


/* =========================================================
   DESCENDRE EN BAS
========================================================= */

function allerEnBas() {

    listeMessages.scrollTop =
        listeMessages.scrollHeight;

}


/* =========================================================
   DECONNEXION
========================================================= */

document.getElementById(
    "btnDeconnexion"
).addEventListener(
    "click",
    async function() {


        fermerConversationPrivee();


        /*
           PRESENCE
        */

        if (canalPresence) {

            try {

                await canalPresence.untrack();

            } catch (error) {

                console.error(error);

            }


            await client.removeChannel(
                canalPresence
            );

            canalPresence =
                null;

        }


        /*
           MESSAGES PUBLICS
        */

        if (canalMessages) {

            await client.removeChannel(
                canalMessages
            );

            canalMessages =
                null;

        }


        /*
           RESET
        */

        utilisateur =
            null;

        pseudoActuel =
            "";


        localStorage.removeItem(
            "compte_chat"
        );


        application.style.display =
            "none";

        connexion.style.display =
            "flex";


        inputPseudo.value =
            "";

        inputMotDePasse.value =
            "";

        inputMessage.value =
            "";


        listeMessages.innerHTML =
            "";


        afficherErreur("");

        afficherSucces("");

    }
);


/* =========================================================
   RECONNEXION AUTOMATIQUE
========================================================= */

async function verifierConnexionSauvegardee() {

    const compteSauvegarde =
        localStorage.getItem(
            "compte_chat"
        );


    if (!compteSauvegarde) {
        return;
    }


    try {

        const compte =
            JSON.parse(
                compteSauvegarde
            );


        if (
            !compte.id
        ) {

            localStorage.removeItem(
                "compte_chat"
            );

            return;

        }


        /*
           IMPORTANT :
           On utilise surtout l'ID interne.
           Le pseudo est récupéré depuis Supabase.
        */

        const {
            data: profil,
            error
        } = await client
            .from("profils")
            .select("*")
            .eq(
                "id",
                compte.id
            )
            .maybeSingle();


        if (
            error ||
            !profil
        ) {

            localStorage.removeItem(
                "compte_chat"
            );

            return;

        }


        await ouvrirApplication(
            profil
        );


    } catch (error) {

        console.error(error);

        localStorage.removeItem(
            "compte_chat"
        );

    }

}


/* =========================================================
   LANCEMENT
========================================================= */

verifierConnexionSauvegardee();
