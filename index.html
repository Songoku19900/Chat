<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2ff;
    color: #222;
}

/* =========================
   CONNEXION
========================= */

#connexion {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.boite-connexion {
    background: white;
    padding: 35px;
    width: 100%;
    max-width: 400px;
    border-radius: 18px;
    box-shadow: 0 8px 30px #0002;
    text-align: center;
}

.logo {
    font-size: 45px;
}

h1 {
    color: #4f46e5;
}

#pseudo {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
    margin-top: 15px;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 15px;
}

#btnConnexion {
    width: 100%;
    margin-top: 15px;
    background: #4f46e5;
    color: white;
    font-weight: bold;
}

#btnConnexion:hover {
    background: #3730a3;
}

#erreur {
    color: #dc2626;
    margin-top: 15px;
}

/* =========================
   APPLICATION
========================= */

#application {
    display: none;
    min-height: 100vh;
}

header {
    height: 65px;
    background: #4f46e5;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
}

header h2 {
    margin: 0;
}

#btnDeconnexion {
    background: white;
    color: #4f46e5;
}

/* =========================
   STRUCTURE
========================= */

.conteneur {
    display: flex;
    height: calc(100vh - 65px);
}

/* =========================
   MENU
========================= */

.menu {
    width: 230px;
    background: white;
    padding: 20px;
    border-right: 1px solid #ddd;
}

.menu button {
    display: block;
    width: 100%;
    text-align: left;
    margin-bottom: 10px;
    background: #f1f5f9;
}

.menu button:hover {
    background: #e0e7ff;
}

.menu p {
    color: #64748b;
}

/* =========================
   DISCUSSION
========================= */

.discussion {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.titre-discussion {
    background: white;
    padding: 20px;
    border-bottom: 1px solid #ddd;
}

.titre-discussion h2 {
    margin: 0;
}

#listeMessages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

/* =========================
   MESSAGES
========================= */

.message {
    background: white;
    padding: 12px 15px;
    border-radius: 12px;
    margin-bottom: 12px;
    max-width: 75%;
    box-shadow: 0 2px 5px #0001;
}

.message .nom {
    font-weight: bold;
    color: #4f46e5;
    margin-bottom: 5px;
}

.message .texte {
    overflow-wrap: anywhere;
}

.message .date {
    font-size: 11px;
    color: #888;
    margin-top: 6px;
}

/* =========================
   ENVOI
========================= */

.zone-envoi {
    display: flex;
    gap: 10px;
    background: white;
    padding: 15px;
    border-top: 1px solid #ddd;
}

#message {
    flex: 1;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 15px;
    min-width: 0;
}

#btnEnvoyer {
    background: #4f46e5;
    color: white;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 650px) {

    .menu {
        width: 70px;
        padding: 10px;
    }

    .menu button {
        font-size: 0;
        text-align: center;
    }

    .menu button::first-letter {
        font-size: 22px;
    }

    .menu p {
        display: none;
    }

    header {
        padding: 0 12px;
    }

    header h2 {
        font-size: 20px;
    }

    .message {
        max-width: 90%;
    }

}

</style>
</head>

<body>

<!-- =========================
     ECRAN DE CONNEXION
========================= -->

<section id="connexion">

    <div class="boite-connexion">

        <div class="logo">💬</div>

        <h1>Bienvenue sur Chat</h1>

        <p>Choisis ton pseudo pour commencer.</p>

        <input
            type="text"
            id="pseudo"
            placeholder="Ton pseudo..."
            maxlength="20"
            autocomplete="off"
        >

        <button id="btnConnexion">
            Se connecter
        </button>

        <p id="erreur"></p>

    </div>

</section>


<!-- =========================
     APPLICATION
========================= -->

<section id="application">

    <header>

        <h2>💬 Chat</h2>

        <button id="btnDeconnexion">
            Se déconnecter
        </button>

    </header>


    <div class="conteneur">

        <!-- MENU -->

        <aside class="menu">

            <p>MENU</p>

            <button id="btnAccueil">
                🏠 Accueil
            </button>

            <button id="btnDiscussion">
                💬 Discussion
            </button>

            <button id="btnAmis">
                👥 Amis
            </button>

            <p>Connecté en tant que :</p>

            <strong id="monPseudo"></strong>

        </aside>


        <!-- DISCUSSION -->

        <main class="discussion">

            <div class="titre-discussion">

                <h2>💬 Discussion générale</h2>

                <p>Parle avec tes potes.</p>

            </div>


            <div id="listeMessages">

                <p>Chargement des messages...</p>

            </div>


            <div class="zone-envoi">

                <input
                    type="text"
                    id="message"
                    placeholder="Écris un message..."
                    maxlength="500"
                    autocomplete="off"
                >

                <button id="btnEnvoyer">
                    Envoyer
                </button>

            </div>

        </main>

    </div>

</section>


<script>

// ==========================================
// CONFIGURATION SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://dlzmbyvclmlgohmecuui.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_qd9EbA110P3SerFO3iq2iQ_cAgPzzGi";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ==========================================
// VARIABLES
// ==========================================

let utilisateur = null;
let pseudoActuel = "";
let canalMessages = null;


// ==========================================
// ELEMENTS HTML
// ==========================================

const connexion = document.getElementById("connexion");

const application = document.getElementById("application");

const inputPseudo = document.getElementById("pseudo");

const erreur = document.getElementById("erreur");

const monPseudo = document.getElementById("monPseudo");

const listeMessages = document.getElementById("listeMessages");

const inputMessage = document.getElementById("message");

const btnConnexion = document.getElementById("btnConnexion");

const btnEnvoyer = document.getElementById("btnEnvoyer");


// ==========================================
// CONNEXION
// ==========================================

btnConnexion.addEventListener("click", connecter);

inputPseudo.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        connecter();
    }

});


async function connecter() {

    erreur.textContent = "";

    const pseudo = inputPseudo.value.trim();

    if (pseudo.length < 3) {

        erreur.textContent =
            "Le pseudo doit contenir au moins 3 caractères.";

        return;
    }

    if (!/^[a-zA-Z0-9_]+$/.test(pseudo)) {

        erreur.textContent =
            "Utilise uniquement des lettres, chiffres et _.";

        return;
    }

    btnConnexion.disabled = true;

    // Connexion anonyme

    const { data, error } =
        await client.auth.signInAnonymously();

    if (error) {

        erreur.textContent =
            "Erreur de connexion : " + error.message;

        btnConnexion.disabled = false;

        return;
    }

    utilisateur = data.user;

    // Vérifier si le pseudo est déjà utilisé

    const { data: profilExistant, error: erreurRecherche } =
        await client
            .from("profils")
            .select("id")
            .eq("pseudo", pseudo)
            .maybeSingle();

    if (erreurRecherche) {

        erreur.textContent =
            "Impossible de vérifier le pseudo.";

        await client.auth.signOut();

        btnConnexion.disabled = false;

        return;
    }

    if (profilExistant) {

        erreur.textContent =
            "Ce pseudo est déjà utilisé.";

        await client.auth.signOut();

        btnConnexion.disabled = false;

        return;
    }

    // Créer le profil

    const { error: erreurProfil } =
        await client
            .from("profils")
            .insert({
                id: utilisateur.id,
                pseudo: pseudo
            });

    if (erreurProfil) {

        if (erreurProfil.code === "23505") {

            erreur.textContent =
                "Ce pseudo est déjà utilisé.";

        } else {

            erreur.textContent =
                "Impossible de créer le profil.";

        }

        await client.auth.signOut();

        btnConnexion.disabled = false;

        return;
    }

    pseudoActuel = pseudo;

    monPseudo.textContent = "@" + pseudoActuel;

    connexion.style.display = "none";

    application.style.display = "block";

    await chargerMessages();

    ecouterMessages();

}


// ==========================================
// CHARGER LES MESSAGES
// ==========================================

async function chargerMessages() {

    const { data, error } =
        await client
            .from("messages")
            .select("*")
            .order("date_envoi", {
                ascending: true
            })
            .limit(100);

    if (error) {

        listeMessages.innerHTML =
            "<p>Impossible de charger les messages.</p>";

        console.error(error);

        return;
    }

    listeMessages.innerHTML = "";

    data.forEach(afficherMessage);

    allerEnBas();

}


// ==========================================
// AFFICHER UN MESSAGE
// ==========================================

function afficherMessage(message) {

    const bloc = document.createElement("div");

    bloc.className = "message";

    const nom = document.createElement("div");

    nom.className = "nom";

    nom.textContent = "@" + message.pseudo;

    const texte = document.createElement("div");

    texte.className = "texte";

    texte.textContent = message.contenu;

    const date = document.createElement("div");

    date.className = "date";

    date.textContent =
        new Date(message.date_envoi)
            .toLocaleString("fr-FR");

    bloc.appendChild(nom);

    bloc.appendChild(texte);

    bloc.appendChild(date);

    listeMessages.appendChild(bloc);

}


// ==========================================
// ENVOYER UN MESSAGE
// ==========================================

btnEnvoyer.addEventListener("click", envoyerMessage);

inputMessage.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        envoyerMessage();
    }

});


async function envoyerMessage() {

    const contenu = inputMessage.value.trim();

    if (contenu === "") {
        return;
    }

    btnEnvoyer.disabled = true;

    const { error } =
        await client
            .from("messages")
            .insert({
                utilisateur_id: utilisateur.id,
                pseudo: pseudoActuel,
                contenu: contenu
            });

    if (error) {

        alert("Impossible d'envoyer le message.");

        console.error(error);

    } else {

        inputMessage.value = "";

    }

    btnEnvoyer.disabled = false;

}


// ==========================================
// TEMPS REEL
// ==========================================

function ecouterMessages() {

    canalMessages = client
        .channel("nouveaux-messages")
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "messages"
            },
            function(payload) {

                afficherMessage(payload.new);

                allerEnBas();

            }
        )
        .subscribe();

}


// ==========================================
// DESCENDRE EN BAS
// ==========================================

function allerEnBas() {

    listeMessages.scrollTop =
        listeMessages.scrollHeight;

}


// ==========================================
// DECONNEXION
// ==========================================

document.getElementById("btnDeconnexion")
    .addEventListener("click", async function() {

        if (canalMessages) {
            await client.removeChannel(canalMessages);
            canalMessages = null;
        }

        await client.auth.signOut();

        utilisateur = null;

        pseudoActuel = "";

        application.style.display = "none";

        connexion.style.display = "flex";

        inputPseudo.value = "";

        inputMessage.value = "";

        listeMessages.innerHTML = "";

        btnConnexion.disabled = false;

    });


// ==========================================
// MENU
// ==========================================

document.getElementById("btnAccueil")
    .addEventListener("click", function() {

        alert("Bienvenue sur Chat !");

    });


document.getElementById("btnDiscussion")
    .addEventListener("click", function() {

        alert("Tu es déjà dans la discussion générale.");

    });


document.getElementById("btnAmis")
    .addEventListener("click", function() {

        alert("La fonctionnalité Amis sera ajoutée prochainement.");

    });

</script>

</body>
</html>
