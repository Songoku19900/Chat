<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   VARIABLES
========================================================= */

:root {
    --primaire: #4f46e5;
    --primaire-hover: #4338ca;
    --primaire-clair: #eef2ff;

    --fond: #f5f7fb;
    --blanc: #ffffff;

    --texte: #1e293b;
    --texte-secondaire: #64748b;

    --bordure: #e2e8f0;

    --vert: #22c55e;
    --vert-clair: #ecfdf5;

    --gris: #94a3b8;

    --rouge: #dc2626;
    --rouge-clair: #fef2f2;

    --ombre: 0 4px 20px rgba(15, 23, 42, 0.07);
}


/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--fond);
    color: var(--texte);
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
    border: none;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}


/* =========================================================
   CONNEXION
========================================================= */

#connexion {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at top left,
            #e0e7ff,
            transparent 35%
        ),
        var(--fond);
}

.boite-connexion {
    width: 100%;
    max-width: 410px;

    padding: 35px;

    background: var(--blanc);

    border: 1px solid var(--bordure);
    border-radius: 22px;

    box-shadow: var(--ombre);

    text-align: center;
}

.logo-connexion {
    width: 72px;
    height: 72px;

    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--primaire-clair);

    border-radius: 20px;

    font-size: 36px;
}

.boite-connexion h1 {
    margin: 0;
    font-size: 28px;
}

.sous-titre {
    margin: 10px 0 25px;

    color: var(--texte-secondaire);

    line-height: 1.5;
}

.champ {
    width: 100%;

    padding: 14px 15px;

    margin-top: 12px;

    border: 1px solid var(--bordure);
    border-radius: 12px;

    outline: none;

    font-size: 15px;

    background: white;

    transition: 0.2s;
}

.champ:focus {
    border-color: var(--primaire);

    box-shadow:
        0 0 0 3px rgba(79, 70, 229, 0.1);
}

.btn-principal,
.btn-secondaire {
    width: 100%;

    padding: 13px 18px;

    margin-top: 12px;

    border-radius: 12px;

    font-size: 15px;
    font-weight: bold;

    transition: 0.2s;
}

.btn-principal {
    background: var(--primaire);
    color: white;
}

.btn-principal:hover {
    background: var(--primaire-hover);
}

.btn-secondaire {
    background: var(--primaire-clair);
    color: var(--primaire);
}

.btn-secondaire:hover {
    background: #e0e7ff;
}

#erreur {
    min-height: 20px;

    margin: 15px 0 0;

    color: var(--rouge);

    font-size: 14px;
}

#succes {
    min-height: 20px;

    margin: 15px 0 0;

    color: #16a34a;

    font-size: 14px;
}


/* =========================================================
   APPLICATION
========================================================= */

#application {
    display: none;

    min-height: 100vh;
}


/* =========================================================
   HEADER
========================================================= */

header {
    height: 68px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 24px;

    background: var(--blanc);

    border-bottom: 1px solid var(--bordure);
}

.logo-chat {
    display: flex;
    align-items: center;

    gap: 10px;

    font-size: 21px;
    font-weight: bold;
}

.logo-chat-icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--primaire);

    border-radius: 11px;

    color: white;
}

.btn-deconnexion {
    padding: 9px 14px;

    background: var(--rouge-clair);

    color: var(--rouge);

    border: 1px solid #fecaca;

    border-radius: 10px;

    font-weight: bold;
}

.btn-deconnexion:hover {
    background: #fee2e2;
}


/* =========================================================
   STRUCTURE
========================================================= */

.conteneur {
    display: flex;

    min-height: calc(100vh - 68px);
}


/* =========================================================
   MENU
========================================================= */

.menu {
    width: 240px;

    flex-shrink: 0;

    padding: 20px;

    background: var(--blanc);

    border-right: 1px solid var(--bordure);
}

.menu-titre {
    margin: 0 0 12px;

    color: var(--texte-secondaire);

    font-size: 12px;
    font-weight: bold;

    text-transform: uppercase;

    letter-spacing: 0.08em;
}

.menu button {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 10px;

    padding: 12px 13px;

    margin-bottom: 7px;

    background: transparent;

    color: var(--texte);

    border-radius: 11px;

    text-align: left;

    font-size: 14px;

    transition: 0.2s;
}

.menu button:hover,
.menu button.actif {
    background: var(--primaire-clair);

    color: var(--primaire);
}

.menu-separation {
    height: 1px;

    margin: 20px 0;

    background: var(--bordure);
}

.mon-compte {
    padding: 12px;

    background: #f8fafc;

    border: 1px solid var(--bordure);

    border-radius: 12px;
}

.mon-compte-label {
    margin-bottom: 5px;

    color: var(--texte-secondaire);

    font-size: 11px;
}

.mon-compte-pseudo {
    font-weight: bold;

    color: var(--primaire);

    overflow-wrap: anywhere;
}


/* =========================================================
   CONTENU
========================================================= */

.discussion {
    flex: 1;

    min-width: 0;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   TITRE
========================================================= */

.titre-discussion {
    padding: 24px 28px;

    background: var(--blanc);

    border-bottom: 1px solid var(--bordure);
}

.titre-discussion h2 {
    margin: 0;

    font-size: 22px;
}

.titre-discussion p {
    margin: 6px 0 0;

    color: var(--texte-secondaire);

    font-size: 14px;
}


/* =========================================================
   ZONE PRINCIPALE
========================================================= */

#listeMessages {
    flex: 1;

    overflow-y: auto;

    padding: 25px 28px;
}


/* =========================================================
   MESSAGE VIDE
========================================================= */

.message-vide {
    padding: 30px;

    background: var(--blanc);

    border: 1px dashed var(--bordure);

    border-radius: 14px;

    color: var(--texte-secondaire);

    text-align: center;
}


/* =========================================================
   ACCUEIL
========================================================= */

.accueil-entete {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;

    margin-bottom: 20px;
}

.accueil-entete h3 {
    margin: 0;

    font-size: 18px;
}

.compteur-connectes {
    padding: 7px 11px;

    background: var(--vert-clair);

    color: #15803d;

    border-radius: 20px;

    font-size: 13px;
    font-weight: bold;
}

.section-utilisateurs {
    margin-bottom: 28px;
}

.section-utilisateurs h3 {
    margin: 0 0 12px;

    font-size: 16px;
}

.grille-utilisateurs {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(260px, 1fr));

    gap: 14px;
}


/* =========================================================
   CARTE UTILISATEUR
========================================================= */

.carte-utilisateur {
    display: flex;
    align-items: center;

    gap: 12px;

    padding: 15px;

    background: var(--blanc);

    border: 1px solid var(--bordure);

    border-radius: 15px;

    box-shadow:
        0 2px 8px rgba(15, 23, 42, 0.04);

    transition: 0.2s;
}

.carte-utilisateur:hover {
    transform: translateY(-1px);

    box-shadow: var(--ombre);
}

.avatar-utilisateur {
    position: relative;

    width: 44px;
    height: 44px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--primaire-clair);

    color: var(--primaire);

    border-radius: 13px;

    font-size: 17px;
    font-weight: bold;
}

.point-en-ligne,
.point-hors-ligne {
    position: absolute;

    right: -2px;
    bottom: -2px;

    width: 13px;
    height: 13px;

    border: 3px solid white;

    border-radius: 50%;
}

.point-en-ligne {
    background: var(--vert);
}

.point-hors-ligne {
    background: var(--gris);
}

.infos-utilisateur {
    min-width: 0;

    flex: 1;
}

.nom-utilisateur {
    font-weight: bold;

    overflow-wrap: anywhere;
}

.statut-utilisateur {
    margin-top: 3px;

    color: var(--texte-secondaire);

    font-size: 12px;
}


/* =========================================================
   BOUTON PARLER
========================================================= */

.btn-parler {
    padding: 8px 11px;

    background: var(--primaire-clair);

    color: var(--primaire);

    border-radius: 9px;

    font-size: 12px;
    font-weight: bold;

    flex-shrink: 0;
}

.btn-parler:hover {
    background: #e0e7ff;
}


/* =========================================================
   DISCUSSION PUBLIQUE
========================================================= */

.message {
    width: fit-content;

    max-width: min(75%, 700px);

    padding: 13px 15px;

    margin-bottom: 12px;

    background: var(--blanc);

    border: 1px solid var(--bordure);

    border-radius: 14px;

    box-shadow:
        0 2px 5px rgba(15, 23, 42, 0.04);
}

.message .nom {
    margin-bottom: 5px;

    color: var(--primaire);

    font-weight: bold;
}

.message .texte {
    overflow-wrap: anywhere;

    line-height: 1.45;
}

.message .date {
    margin-top: 7px;

    color: var(--gris);

    font-size: 11px;
}


/* =========================================================
   CONVERSATION PRIVEE
========================================================= */

.en-tete-prive {
    display: flex;
    align-items: center;

    gap: 12px;

    margin-bottom: 20px;
}

.btn-retour {
    padding: 9px 12px;

    background: var(--primaire-clair);

    color: var(--primaire);

    border-radius: 10px;

    font-weight: bold;
}

.btn-retour:hover {
    background: #e0e7ff;
}

.info-prive {
    display: flex;
    flex-direction: column;
}

.info-prive-nom {
    font-weight: bold;

    font-size: 17px;
}

.info-prive-statut {
    margin-top: 3px;

    color: var(--texte-secondaire);

    font-size: 12px;
}


/* =========================================================
   MESSAGES PRIVES
========================================================= */

.message-prive {
    display: flex;

    margin-bottom: 12px;
}

.message-prive.moi {
    justify-content: flex-end;
}

.bulle-privee {
    max-width: min(75%, 600px);

    padding: 11px 14px;

    background: white;

    border: 1px solid var(--bordure);

    border-radius: 15px;
}

.message-prive.moi .bulle-privee {
    background: var(--primaire-clair);

    border-color: #c7d2fe;
}

.nom-prive {
    margin-bottom: 4px;

    color: var(--primaire);

    font-size: 12px;
    font-weight: bold;
}

.texte-prive {
    overflow-wrap: anywhere;

    line-height: 1.45;
}

.date-prive {
    margin-top: 6px;

    color: var(--gris);

    font-size: 10px;
}


/* =========================================================
   ZONE ENVOI
========================================================= */

.zone-envoi {
    display: flex;

    gap: 10px;

    padding: 15px 20px;

    background: var(--blanc);

    border-top: 1px solid var(--bordure);
}

#message {
    flex: 1;

    min-width: 0;

    margin: 0;
}

#btnEnvoyer {
    padding: 0 22px;

    background: var(--primaire);

    color: white;

    border-radius: 11px;

    font-weight: bold;
}

#btnEnvoyer:hover {
    background: var(--primaire-hover);
}

#btnVocal {
    width: 48px;
    min-width: 48px;
    padding: 0;
    background: #ef4444;
    color: white;
    border-radius: 11px;
    font-size: 20px;
}

#btnVocal:hover {
    filter: brightness(0.95);
}

#btnImage {
    width: 48px;
    min-width: 48px;
    padding: 0;
    background: #2563eb;
    color: white;
    border-radius: 11px;
    font-size: 20px;
}

#btnImage:hover {
    filter: brightness(0.95);
}

.image-privee {
    display: block;
    max-width: min(320px, 100%);
    max-height: 400px;
    margin-top: 5px;
    border-radius: 12px;
    object-fit: contain;
}


#btnVocal.enregistrement {
    background: #111827;
    animation: pulseVocal 1s infinite;
}

@keyframes pulseVocal {
    50% {
        transform: scale(1.06);
    }
}

#statutVocal {
    align-self: center;
    color: var(--texte-secondaire);
    font-size: 12px;
    min-width: 85px;
}

.audio-prive {
    width: min(280px, 100%);
    display: block;
    margin-top: 5px;
}


/* =========================================================
   LECTEUR VOCAL SIMPLE - MOBILE ET PC
========================================================= */

.lecteur-vocal {
    display: flex;
    align-items: center;
    gap: 9px;
    width: min(310px, 100%);
    max-width: 100%;
    min-width: 0;
    margin-top: 5px;
    padding: 8px 10px;
    box-sizing: border-box;
    border-radius: 14px;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
}

.bouton-vocal-lire {
    width: 44px;
    min-width: 44px;
    height: 44px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: var(--primaire);
    color: white;
    font-size: 19px;
    line-height: 44px;
    text-align: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.bouton-vocal-lire:active {
    transform: scale(.96);
}

.barre-vocal {
    flex: 1;
    min-width: 70px;
    width: 100%;
    height: 7px;
    margin: 0;
    accent-color: var(--primaire);
    cursor: pointer;
}

.duree-vocal {
    min-width: 43px;
    color: var(--texte-secondaire);
    font-size: 12px;
    text-align: right;
    white-space: nowrap;
}

.lecteur-vocal audio {
    display: none;
}

@media (max-width: 750px) {
    .lecteur-vocal {
        width: min(100%, 330px);
        padding: 7px 8px;
        gap: 8px;
    }

    .bouton-vocal-lire {
        width: 46px;
        min-width: 46px;
        height: 46px;
        line-height: 46px;
        font-size: 20px;
    }

    .barre-vocal {
        min-width: 60px;
        height: 8px;
    }

    .duree-vocal {
        min-width: 42px;
        font-size: 11px;
    }

    .bulle-privee,
    .message {
        max-width: 92%;
    }
}

@media (max-width: 380px) {
    .lecteur-vocal {
        gap: 6px;
        padding: 6px;
    }

    .bouton-vocal-lire {
        width: 44px;
        min-width: 44px;
        height: 44px;
        line-height: 44px;
    }

    .duree-vocal {
        min-width: 38px;
        font-size: 10px;
    }
}


/* =========================================================
   RECHERCHE POTES
========================================================= */

.zone-recherche {
    margin-bottom: 20px;
}

#recherchePotes {
    margin: 0;
}


/* =========================================================
   BADGE EN LIGNE
========================================================= */

.badge-en-ligne {
    display: inline-block;

    margin-top: 5px;

    color: #16a34a;

    font-size: 12px;
}

.badge-hors-ligne {
    display: inline-block;

    margin-top: 5px;

    color: var(--gris);

    font-size: 12px;
}


/* =========================================================
   RESPONSIVE
========================================================= */



/* =========================================================
   APPELS AUDIO
========================================================= */

.btn-appel {
    margin-left: auto;
    min-width: 44px;
    min-height: 44px;
    padding: 8px 12px;
    border: none;
    border-radius: 12px;
    background: #dcfce7;
    color: #166534;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.btn-appel:hover {
    background: #bbf7d0;
}

.fenetre-appel {
    position: fixed;
    inset: 0;
    z-index: 3000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(15, 23, 42, .55);
    box-sizing: border-box;
}

.carte-appel {
    width: min(92vw, 390px);
    padding: 28px 22px;
    border-radius: 22px;
    background: white;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    text-align: center;
}

.appel-icone {
    width: 74px;
    height: 74px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #dcfce7;
    font-size: 34px;
}

.appel-nom {
    margin-bottom: 7px;
    color: var(--texte);
    font-size: 21px;
    font-weight: bold;
}

.appel-statut {
    margin-bottom: 22px;
    color: var(--texte-secondaire);
    font-size: 14px;
}

.appel-actions {
    display: flex;
    gap: 10px;
}

.appel-actions button {
    flex: 1;
    min-height: 48px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.btn-accepter-appel {
    background: #22c55e;
    color: white;
}

.btn-refuser-appel,
.btn-raccrocher-appel {
    background: #ef4444;
    color: white;
}

.btn-raccrocher-appel {
    width: 100%;
}

.audio-distant {
    display: none;
}

@media (max-width: 750px) {
    .btn-appel {
        margin-left: auto;
        min-width: 44px;
        width: 44px;
        padding: 0;
    }

    .fenetre-appel {
        align-items: flex-end;
        padding: 12px;
        padding-bottom: calc(84px + env(safe-area-inset-bottom));
    }

    .carte-appel {
        width: 100%;
        max-width: none;
        padding: 24px 18px;
        border-radius: 20px;
    }

    .appel-actions button {
        min-height: 52px;
    }
}

@media (max-width: 360px) {
    .btn-appel {
        min-width: 40px;
        width: 40px;
        min-height: 40px;
    }
}

@media (max-width: 750px) {

    /* ===== Téléphone : navigation en bas ===== */

    html,
    body {
        width: 100%;
        min-width: 0;
        overflow-x: hidden;
    }

    body {
        -webkit-tap-highlight-color: transparent;
    }

    header {
        height: 58px;
        min-height: 58px;
        padding: 0 10px;
        gap: 8px;
        position: relative;
        z-index: 20;
    }

    .conteneur {
        display: block;
        width: 100%;
        min-height: calc(100dvh - 58px);
        height: calc(100dvh - 58px);
        position: relative;
    }

    /* La barre latérale devient une barre de navigation tactile en bas */
    .menu {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: calc(70px + env(safe-area-inset-bottom));
        min-height: 70px;
        padding: 4px 4px env(safe-area-inset-bottom);
        margin: 0;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        justify-content: space-around;
        gap: 2px;
        border-right: none;
        border-top: 1px solid rgba(255,255,255,.12);
        z-index: 1000;
        box-sizing: border-box;
    }

    .menu-titre,
    .menu-separation,
    .mon-compte {
        display: none !important;
    }

    .menu button {
        flex: 1 1 0;
        min-width: 0;
        height: 62px;
        padding: 6px 3px;
        margin: 0;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        line-height: 1.05;
        white-space: normal;
        text-align: center;
    }

    .menu button span {
        display: block;
        font-size: 22px;
        line-height: 1;
    }

    .discussion {
        width: 100%;
        height: calc(100dvh - 58px);
        min-height: 0;
        padding-bottom: calc(76px + env(safe-area-inset-bottom));
        box-sizing: border-box;
        overflow: hidden;
    }

    .titre-discussion {
        min-height: 54px;
        padding: 10px 12px;
        gap: 8px;
        box-sizing: border-box;
    }

    #listeMessages {
        padding: 12px;
        padding-bottom: 12px;
        min-height: 0;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
    }

    .message,
    .bulle-privee {
        max-width: 88%;
        word-break: break-word;
        overflow-wrap: anywhere;
    }

    /* Zone d'envoi plus compacte et facile à toucher */
    .zone-envoi {
        padding: 8px;
        gap: 6px;
        flex-wrap: nowrap;
        box-sizing: border-box;
    }

    #messageInput {
        min-width: 0;
        flex: 1 1 auto;
        height: 44px;
        font-size: 16px; /* évite le zoom automatique sur iPhone */
    }

    #btnVocal,
    #btnImage {
        flex: 0 0 44px;
        width: 44px;
        height: 44px;

/* =========================================================

========================================================= */

function verifierPseudo(pseudo) {

    return /^[a-zA-Z0-9_]{3,20}$/.test(pseudo);

}


function verifierCode(code) {

    return code.length >= 6;

}


/* =========================================================
   INSCRIPTION
========================================================= */

btnInscription.addEventListener(
    "click",
    inscrire
);


async function inscrire() {

    afficherErreur("");
    afficherSucces("");

    const pseudo =
        inputPseudo.value.trim();

    const code =
        inputMotDePasse.value;


    if (!verifierPseudo(pseudo)) {

        afficherErreur(
            "Le pseudo doit contenir 3 à 20 caractères : lettres, chiffres ou _."
        );

        return;
    }


    if (!verifierCode(code)) {

        afficherErreur(
            "Le code doit contenir au moins 6 caractères."
        );

        return;
    }


    btnInscription.disabled = true;

    afficherSucces(
        "Création du compte..."
    );


    const {
        data: profilExistant,
        error: erreurRecherche
    } = await client
        .from("profils")
        .select("id")
        .eq("pseudo", pseudo)
        .maybeSingle();


    if (erreurRecherche) {

        afficherErreur(
            "Erreur de vérification : " +
            erreurRecherche.message
        );

        console.error(erreurRecherche);

        btnInscription.disabled = false;

        return;
    }


    if (profilExistant) {

        afficherErreur(
            "Ce pseudo est déjà utilisé."
        );

        btnInscription.disabled = false;

        return;
    }


    const nouvelId =
        crypto.randomUUID();


    const {
        error
    } = await client
        .from("profils")
        .insert({

            id: nouvelId,

            pseudo: pseudo,

            code: code

        });


    if (error) {

        afficherErreur(
            "Erreur lors de la création : " +
            error.message
        );

        console.error(error);

        btnInscription.disabled = false;

        return;
    }


    afficherSucces(
        "Compte créé ! Tu peux maintenant te connecter."
    );


    inputMotDePasse.value = "";

    btnInscription.disabled = false;

}


/* =========================================================
   CONNEXION
========================================================= */

btnConnexion.addEventListener(
    "click",
    connecter
);


inputMotDePasse.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            connecter();

        }

    }
);


async function connecter() {

    afficherErreur("");
    afficherSucces("");

    const pseudo =
        inputPseudo.value.trim();

    const code =
        inputMotDePasse.value;


    if (!verifierPseudo(pseudo)) {

        afficherErreur(
            "Pseudo invalide."
        );

        return;
    }


    if (!code) {

        afficherErreur(
            "Entre ton code secret."
        );

        return;
    }


    btnConnexion.disabled = true;

    afficherSucces(
        "Connexion..."
    );


    const {
        data: profil,
        error
    } = await client
        .from("profils")
        .select("*")
        .eq("pseudo", pseudo)
        .eq("code", code)
        .maybeSingle();


    if (error) {

        afficherErreur(
            "Erreur de connexion : " +
            error.message
        );

        console.error(error);

        btnConnexion.disabled = false;

        return;
    }


    if (!profil) {

        afficherErreur(
            "Pseudo ou code incorrect."
        );

        btnConnexion.disabled = false;

        return;
    }


    await ouvrirApplication(profil);

    btnConnexion.disabled = false;

}


/* =========================================================
   OUVRIR APPLICATION
========================================================= */

async function ouvrirApplication(profil) {

    utilisateur = profil;

    pseudoActuel = profil.pseudo;


    localStorage.setItem(
        "compte_chat",
        JSON.stringify({

            id: profil.id,

    monPseudo.textContent =

}

   PRESENCE EN LIGNE / HORS LIGNE
========================================================= */

async function demarrerPresence() {

    if (!utilisateur) {
        return;
    }


    if (canalPresence) {

        await client.removeChannel(
            canalPresence
        );

        canalPresence = null;

    }


    canalPresence =
        client.channel(
            "presence-chat",
            {
                config: {

                    presence: {

                        key:
                            utilisateur.id

                    }

                }
            }
        );


    canalPresence.on(
        "presence",
        {
            event: "sync"
        },
        function() {

            if (
                titrePage.textContent.includes(
                    "Accueil"
                )
            ) {

                afficherUtilisateurs();

            }

        }
    );


    canalPresence.on(
        "presence",
        {
            event: "join"
        },
        function() {

            if (
                titrePage.textContent.includes(
                    "Accueil"
                )
            ) {

                afficherUtilisateurs();

            }

        }
    );


    canalPresence.on(
        "presence",
        {
            event: "leave"
        },
        function() {

            if (
                titrePage.textContent.includes(
                    "Accueil"
                )
            ) {

                afficherUtilisateurs();

            }

        }
    );


    canalPresence.subscribe(
        async function(status) {

            if (
                status === "SUBSCRIBED"
            ) {

                await canalPresence.track({

                    id:
                        utilisateur.id,

                    pseudo:
                        utilisateur.pseudo

                });


                afficherUtilisateurs();

            }

        }
    );

}


/* =========================================================
   RECUPERER LES IDS EN LIGNE
========================================================= */

function recupererIdsConnectes() {

    const ids =
        new Set();


    if (!canalPresence) {
        return ids;
    }


    const state =
        canalPresence.presenceState();


    Object.keys(state).forEach(
        function(key) {

            const presences =
                state[key];


            if (
                Array.isArray(presences)
            ) {

                presences.forEach(
                    function(presence) {

                        if (
                            presence.id
                        ) {

                            ids.add(
                                String(
                                    presence.id
                                )
                            );

                        }

                    }
                );

            }

        }
    );


    return ids;

}

   ACCUEIL - UTILISATEURS
========================================================= */

async function afficherUtilisateurs() {

    if (!canalPresence) {
        return;
    }


    listeMessages.innerHTML = `

        <div class="message-vide">
            Chargement des utilisateurs...
        </div>

    `;


    const {
        data: profils,
        error
    } = await client
        .from("profils")
        .select("id, pseudo")
        .order(
            "pseudo",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);

        listeMessages.innerHTML = `

            <div class="message-vide">
                Impossible de charger les utilisateurs.
            </div>

        `;

        return;
    }


    const idsConnectes =
        recupererIdsConnectes();


    const connectes = [];

    const deconnectes = [];


    profils.forEach(
        function(profil) {

            if (
                idsConnectes.has(
                    String(profil.id)
                )
            ) {

                connectes.push(
                    profil
                );

            } else {

                deconnectes.push(
                    profil
                );

            }

        }

        document.createElement("div");

    accueilEntete.className =
        "accueil-entete";

        document.createElement("h3");

========================================================= */


function formaterDureeVocal(secondes) {
    if (!Number.isFinite(secondes) || secondes < 0) {
        return "0:00";
    }

    const total = Math.floor(secondes);
    const minutes = Math.floor(total / 60);
    const secondesRestantes = total % 60;

    return minutes + ":" +
        String(secondesRestantes).padStart(2, "0");
}


function creerLecteurVocal(url) {

    const lecteur = document.createElement("div");
    lecteur.className = "lecteur-vocal";

    const audio = document.createElement("audio");
    audio.preload = "metadata";
    audio.src = url;

    const bouton = document.createElement("button");
    bouton.type = "button";
    bouton.className = "bouton-vocal-lire";
    bouton.textContent = "▶";
    bouton.setAttribute("aria-label", "Lire le vocal");

    const barre = document.createElement("input");
    barre.type = "range";
    barre.className = "barre-vocal";
    barre.min = "0";
    barre.max = "100";
    barre.value = "0";
    barre.step = "0.1";
    barre.setAttribute("aria-label", "Position du vocal");

    const duree = document.createElement("span");
    duree.className = "duree-vocal";
    duree.textContent = "0:00";

    lecteur.appendChild(bouton);
    lecteur.appendChild(barre);
    lecteur.appendChild(duree);
    lecteur.appendChild(audio);

    function mettreAJourDuree() {
        if (Number.isFinite(audio.duration)) {
            duree.textContent = formaterDureeVocal(audio.currentTime);
        }
    }

    audio.addEventListener("loadedmetadata", function() {
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
            barre.max = String(audio.duration);
            duree.textContent = formaterDureeVocal(audio.duration);
        }
    });

    audio.addEventListener("timeupdate", function() {
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
            barre.value = String(audio.currentTime);
        }
        mettreAJourDuree();
    });

    audio.addEventListener("play", function() {
        bouton.textContent = "❚❚";
        bouton.setAttribute("aria-label", "Mettre le vocal en pause");
    });

    audio.addEventListener("pause", function() {
        bouton.textContent = "▶";
        bouton.setAttribute("aria-label", "Lire le vocal");
    });

    audio.addEventListener("ended", function() {
        bouton.textContent = "▶";
        bouton.setAttribute("aria-label", "Relire le vocal");
        barre.value = "0";
        duree.textContent = formaterDureeVocal(audio.duration);
    });

    audio.addEventListener("error", function() {
        bouton.disabled = true;
        bouton.textContent = "⚠";
        duree.textContent = "Erreur";
    });

    bouton.addEventListener("click", async function() {
        try {
            if (audio.paused) {
                await audio.play();
            } else {
                audio.pause();
            }
        } catch (error) {
            console.error("Lecture du vocal impossible :", error);
            duree.textContent = "Erreur";
        }
    });

    barre.addEventListener("input", function() {
        if (Number.isFinite(audio.duration)) {
            audio.currentTime = Number(barre.value);
        }
    });

    return lecteur;
}


function afficherMessage(message) {

    const bloc = document.createElement("div");
    bloc.className = "message";

    const nom = document.createElement("div");
    nom.className = "nom";
    nom.textContent = "@" + message.pseudo;
    bloc.appendChild(nom);

    if (message.type_message === "image" && message.image_url) {
        const image = document.createElement("img");
        image.className = "image-privee";
        image.src = message.image_url;
        image.alt = "Image envoyée par @" + message.pseudo;
        image.loading = "lazy";
        image.style.cursor = "pointer";
        image.addEventListener("click", function() {
            window.open(message.image_url, "_blank");
        });
        bloc.appendChild(image);
    } else if (message.type_message === "vocal" && message.audio_url) {
        bloc.appendChild(
            creerLecteurVocal(message.audio_url)
        );
    } else if (message.contenu) {
        const texte = document.createElement("div");
        texte.className = "texte";
        texte.textContent = message.contenu;
        bloc.appendChild(texte);
    }

    const date = document.createElement("div");
    date.className = "date";
    if (message.date_envoi) {
        date.textContent = new Date(message.date_envoi).toLocaleString("fr-FR");
    }
    bloc.appendChild(date);
    listeMessages.appendChild(bloc);
}

function afficherPartieMorpion(partie) {

    const grille = Array.isArray(partie.grille)
        ? partie.grille
        : ["", "", "", "", "", "", "", "", ""];

    const estMonTour = partie.statut === "en_cours" && partie.tour === symboleMorpion;

    const nomAdversaire = symboleMorpion === "X"
        ? "ton adversaire"
        : "le créateur";

    listeMessages.innerHTML = `
        <div class="zone-morpion">
            <h3>❌⭕ Morpion</h3>
            <div class="info-morpion" id="infoMorpion"></div>
            <div class="grille-morpion" id="grilleMorpion"></div>
            <button class="btn-quitter-jeu" id="btnQuitterMorpion" type="button">Quitter la partie</button>
        </div>
    `;

    const info = document.getElementById("infoMorpion");

    if (partie.statut === "invitation") {
        info.textContent = "Invitation envoyée. En attente de ton pote…";
    } else if (partie.statut === "terminee") {
        if (partie.gagnant === utilisateur.id) {
            info.textContent = "🏆 Tu as gagné !";
        } else if (partie.gagnant) {
            info.textContent = "😄 Ton adversaire a gagné.";
        } else {
            info.textContent = "🤝 Match nul !";
        }
    } else if (partie.statut === "refusee") {
        info.textContent = "Invitation refusée.";
    } else {
        info.textContent = estMonTour
            ? "👉 C'est ton tour (" + symboleMorpion + ")."
            : "⏳ C'est au tour de " + nomAdversaire + ".";
    }

    const zone = document.getElementById("grilleMorpion");

    grille.forEach(function(valeur, index) {
        const bouton = document.createElement("button");
        bouton.className = "case-morpion";
        bouton.type = "button";
        bouton.textContent = valeur;
        bouton.disabled = Boolean(valeur) || !estMonTour;
        bouton.addEventListener("click", function() {
            jouerCoupMorpion(index);
        });
        zone.appendChild(bouton);
    });

    document.getElementById("btnQuitterMorpion")
        .addEventListener("click", quitterMorpion);
}


function calculerGagnantMorpion(grille) {
    const lignes = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
    ];

    for (const ligne of lignes) {
        const a = grille[ligne[0]];
        const b = grille[ligne[1]];
        const c = grille[ligne[2]];
        if (a && a === b && b === c) return a;
    }

    if (grille.every(function(caseJeu) { return caseJeu; })) return "nul";
    return null;
}


async function jouerCoupMorpion(index) {

    const partie = partieMorpionActuelle;
    if (!partie || partie.statut !== "en_cours" || partie.tour !== symboleMorpion) return;

    const grille = Array.isArray(partie.grille)
        ? [...partie.grille]
        : ["", "", "", "", "", "", "", "", ""];

    if (grille[index]) return;

    grille[index] = symboleMorpion;

    const resultat = calculerGagnantMorpion(grille);
    const modifications = {
        grille: grille,
        tour: symboleMorpion === "X" ? "O" : "X"
    };

    if (resultat) {
        modifications.statut = "terminee";
        modifications.gagnant = resultat === "nul"
            ? null
            : (resultat === "X" ? partie.joueur_x : partie.joueur_o);
    }

    const { data, error } = await client
        .from("parties_morpion")
        .update(modifications)
        .eq("id", partie.id)
        .eq("statut", "en_cours")
        .select()

    if (error) {

        return;
    }

    partieMorpionActuelle = data;
    afficherPartieMorpion(data);
}


async function quitterMorpion() {
    const partie = partieMorpionActuelle;
    if (!partie) {
        afficherJeux();
        return;
    }

    if (partie.statut === "invitation") {
        await client.from("parties_morpion")
            .update({ statut: "refusee" })
            .eq("id", partie.id);
    } else if (partie.statut === "en_cours") {
        await client.from("parties_morpion")
            .update({ statut: "terminee", gagnant: symboleMorpion === "X" ? partie.joueur_o : partie.joueur_x })
            .eq("id", partie.id);
    }

    partieMorpionActuelle = null;
    symboleMorpion = null;
    await afficherJeux();
}


async function initialiserEcouteMorpion() {

    if (canalMorpion) {
        try { await client.removeChannel(canalMorpion); } catch (e) { console.error(e); }
    }

    canalMorpion = client
        .channel("morpion-en-ligne")
        .on("postgres_changes", {
            event: "INSERT",
            schema: "public",
            table: "parties_morpion"
        }, async function(payload) {
            if (!utilisateur) return;
            const partie = payload.new;

            if (String(partie.joueur_o) === String(utilisateur.id) && partie.statut === "invitation") {
                if (titrePage.textContent.includes("Jeux")) {
                    await chargerInvitationsMorpion();
                } else {
                    afficherFenetreInvitationMorpion(partie);
                }
            }
        })
        .on("postgres_changes", {
            event: "UPDATE",
            schema: "public",
            table: "parties_morpion"
        }, function(payload) {
            if (!utilisateur) return;

            const partie = payload.new;
            const concerneUtilisateur =
                String(partie.joueur_x) === String(utilisateur.id) ||
                String(partie.joueur_o) === String(utilisateur.id);

            if (!concerneUtilisateur) return;

            partieMorpionActuelle = partie;

            if (String(partie.joueur_x) === String(utilisateur.id)) {
                symboleMorpion = "X";
            } else if (String(partie.joueur_o) === String(utilisateur.id)) {
                symboleMorpion = "O";
            }

            if (partie.statut !== "invitation") {
                arreterSurveillanceMorpion();
            }

            if (titrePage.textContent.includes("Morpion")) {
                afficherPartieMorpion(partie);
            }
        })
        .subscribe();
}

/* =========================================================
   TROUVER OU CREER CONVERSATION
========================================================= */

async function trouverOuCreerConversation(
    idUtilisateur1,
    idUtilisateur2
) {

    /*
       On cherche d'abord dans un sens.
    */

    let {
        data: conversation,
        error
    } = await client
        .from("conversations_privees")
        .select("*")
        .eq(
            "utilisateur1",
            idUtilisateur1
        )
        .eq(
            "utilisateur2",
            idUtilisateur2
        )
        .maybeSingle();


    if (error) {

        afficherErreurPrivee(
            error
        );

        return null;
    }


    if (conversation) {

        return conversation;

    }


    /*
       Puis dans l'autre sens.
    */

    const resultatInverse =
        await client
            .from("conversations_privees")
            .select("*")
            .eq(
                "utilisateur1",
                idUtilisateur2
            )
            .eq(
                "utilisateur2",
                idUtilisateur1
            )
            .maybeSingle();


    if (
        resultatInverse.error
    ) {

        afficherErreurPrivee(
            resultatInverse.error
        );

        return null;
    }


    if (
        resultatInverse.data
    ) {

        return resultatInverse.data;

    }


    /*
       Aucune conversation :
       on la crée.
    */

    const resultatCreation =
        await client
            .from("conversations_privees")
            .insert({

                utilisateur1:
                    idUtilisateur1,

                utilisateur2:
                    idUtilisateur2

            })
            .select()
            .single();


    if (
        resultatCreation.error
    ) {

        afficherErreurPrivee(
            resultatCreation.error
        );

        return null;
    }


    return resultatCreation.data;

}

/* =========================================================
   VOCAUX PRIVES
========================================================= */

async function demarrerOuArreterVocal() {

    if (enregistrementVocal) {

        if (mediaRecorder) {
            mediaRecorder.stop();
        }

        return;
    }

    if (!conversationActuelle && !utilisateur) {
        return;
    }

    if (conversationActuelle && !utilisateurPriveActuel) {
        alert("La conversation privée n'est plus disponible.");
        return;
    }

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia ||
        !window.MediaRecorder
    ) {
        alert("Ton navigateur ne permet pas l'enregistrement vocal.");
        return;
    }

    try {

        const flux =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        morceauxVocal = [];

        mediaRecorder =
            new MediaRecorder(flux);

        enregistrementVocal =
            true;

        btnVocal.classList.add(
            "enregistrement"
        );

        btnVocal.textContent =
            "⏹️";

        statutVocal.textContent =
            "Enregistrement...";

        mediaRecorder.ondataavailable =
            function(event) {

                if (event.data.size > 0) {
                    morceauxVocal.push(
                        event.data
                    );
                }

            };

        mediaRecorder.onstop =
            async function() {

                enregistrementVocal =
                    false;

                btnVocal.classList.remove(
                    "enregistrement"
                );

                btnVocal.textContent =
                    "🎙️";

                statutVocal.textContent =
                    "Envoi...";

                flux.getTracks().forEach(
                    function(track) {
                        track.stop();
                    }
                );

                const blob =
                    new Blob(
                        morceauxVocal,
                        {
                            type:
                                mediaRecorder.mimeType ||
                                "audio/webm"
                        }
                    );

                if (conversationActuelle) {
                    await envoyerVocalPrive(blob);
                } else {
                    await envoyerVocalPublic(blob);
                }

            };

        mediaRecorder.start();

    } catch (error) {

        console.error(error);

        statutVocal.textContent =
            "";

        alert(
            "Impossible d'utiliser le micro : " +
            error.message
        );

    }

}

                .getPublicUrl(nomFichier);

            const { error } = await client
                .from("messages")
                .insert({
                    utilisateur_id: utilisateur.id,
                    pseudo: pseudoActuel,
                    contenu: "",
                    type_message: "image",
                    image_url: resultatUrl.data.publicUrl
                });

            if (error) throw error;

            statutVocal.textContent = "Image envoyée";
            setTimeout(function() { statutVocal.textContent = ""; }, 1500);
        } catch (error) {
            console.error(error);
            statutVocal.textContent = "";
            alert("Impossible d'envoyer l'image : " + error.message);
        } finally {
            btnImage.disabled = false;
            inputImage.value = "";
        }
        return;
    }

    const extension =
        (
            fichier.name.split(".").pop() ||
            "jpg"
        )
        .toLowerCase();

    const nomFichier =
        utilisateur.id +
        "/" +
        conversationActuelle.id +
        "-" +
        Date.now() +
        "." +
        extension;

    try {

        const resultatUpload =
            await client
                .storage
                .from("images")
                .upload(
                    nomFichier,
                    fichier,
                    {
                        contentType:
                            fichier.type,
                        upsert:
                            false
                    }
                );

        if (resultatUpload.error) {
            throw resultatUpload.error;
        }

        const resultatUrl =
            client
                .storage
                .from("images")
                .getPublicUrl(
                    nomFichier
                );

        const imageUrl =
            resultatUrl.data.publicUrl;

        const resultatMessage =
            await client
                .from("messages_prives")
                .insert({

                    conversation_id:
                        conversationActuelle.id,

                    auteur_id:
                        utilisateur.id,

                    pseudo:
                        pseudoActuel,

                    texte:
                        "",

                    type_message:
                        "image",

                    image_url:
                        imageUrl
                });

        if (resultatMessage.error) {
            throw resultatMessage.error;
        }

        statutVocal.textContent =
            "Image envoyée";

        setTimeout(
            function() {
                statutVocal.textContent =
                    "";
            },
            1500
        );

    } catch (error) {

        console.error(error);

        statutVocal.textContent =
            "";

        alert(
            "Impossible d'envoyer l'image : " +
            error.message
        );

    } finally {

        btnImage.disabled =
            false;

        inputImage.value =
            "";

    }

}

/* =========================================================
   APPELS AUDIO - WEBRTC
========================================================= */

function creerConnexionWebRTC() {

    if (
        peerConnectionAppel
    ) {

        peerConnectionAppel.close();

    }


    peerConnectionAppel =
        new RTCPeerConnection(
            SERVEURS_WEBRTC
        );


    peerConnectionAppel.ontrack =
        function(event) {

            if (
                !audioDistantAppel
            ) {

                audioDistantAppel =
                    document.createElement("audio");

                audioDistantAppel.className =
                    "audio-distant";

                audioDistantAppel.autoplay =
                    true;

                audioDistantAppel.playsInline =
                    true;

                document.body.appendChild(
                    audioDistantAppel
                );

            }


            if (
                event.streams &&
                event.streams[0]
            ) {

                audioDistantAppel.srcObject =
                    event.streams[0];

            }

        };


    peerConnectionAppel.onicecandidate =
        async function(event) {

            if (
                !event.candidate ||
                !appelActuelId ||
                !utilisateur
            ) {

                return;

            }


            await envoyerSignalAppel(
                "candidate",
                event.candidate.toJSON()
            );

        };


    peerConnectionAppel.onconnectionstatechange =
        function() {

            if (
                !peerConnectionAppel
            ) {

                return;

            }


            const etat =
                peerConnectionAppel.connectionState;


            if (
                etat === "failed" ||
                etat === "closed"
            ) {

                terminerAppel(
                    "terminee",
                    false
                );

            }

        };


    return peerConnectionAppel;

}


async function preparerMicroAppel() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            "Ton navigateur ne permet pas les appels audio."
        );

        return false;

    }


    try {

        fluxMicroAppel =
            await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: false
            });


    } catch (error) {

        console.error(error);

        alert(
            "Impossible d'utiliser le micro. Autorise le microphone dans ton navigateur."
        );

        return false;

    }


    return true;

}


async function creerCanalSignauxAppel(
    appelId
) {

    if (
        canalSignauxAppel
    ) {

        await client.removeChannel(
            canalSignauxAppel
        );

        canalSignauxAppel =
            null;

    }


    canalSignauxAppel =
        client
            .channel(
                "signaux-appel-" +
                appelId
            )
            .on(
                "postgres_changes",
                {

                    event: "INSERT",

                    schema: "public",

                    table: "signaux_appels",

                    filter:
                        "appel_id=eq." +
                        appelId

                },
                async function(payload) {

                    const signal =
                        payload.new;


                    if (
                        !utilisateur ||
                        String(
                            signal.expediteur_id
                        ) ===
                        String(
                            utilisateur.id
                        )
                    ) {

                        return;

                    }


                    await traiterSignalAppel(
                        signal
                    );

                }
            )
            .subscribe();


    /*
       On recharge aussi les signaux déjà envoyés.
       Cela évite de rater l'offre si elle a été créée
       juste avant la connexion au canal.
    */

    const {
        data: signaux,
        error
    } = await client
        .from("signaux_appels")
        .select("*")
        .eq(
            "appel_id",
            appelId
        )
        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (
        error
    ) {

        console.error(
            "Erreur chargement signaux :",
            error
        );

        return;

    }


    if (
        Array.isArray(signaux)
    ) {

        for (
            const signal of signaux
        ) {

            if (
                utilisateur &&
                String(
                    signal.expediteur_id
                ) !==
                String(
                    utilisateur.id
                )
            ) {

                await traiterSignalAppel(
                    signal
                );

            }

        }

    }

}


async function envoyerSignalAppel(
    type,
    contenu
) {

    if (
        !appelActuelId ||
        !utilisateur
    ) {

        return;

    }


    const {
        error
    } = await client
        .from("signaux_appels")
        .insert({

            appel_id:
                appelActuelId,

            expediteur_id:
                utilisateur.id,

            type_signal:
                type,

            contenu:
                contenu

        });


    if (
        error
    ) {

        console.error(
            "Erreur signal appel :",
            error
        );

    }

}


async function traiterSignalAppel(
    signal
) {

    if (
        !peerConnectionAppel ||
        !signal ||
        !signal.contenu
    ) {

        return;

    }


    try {

        if (
            signal.type_signal ===
            "answer"
        ) {

            if (
                !peerConnectionAppel.currentRemoteDescription
            ) {

                await peerConnectionAppel.setRemoteDescription(
                    new RTCSessionDescription(
                        signal.contenu
                    )
                );

            }

        }


        if (
            signal.type_signal ===
            "candidate"
        ) {

            try {

                await peerConnectionAppel.addIceCandidate(
                    new RTCIceCandidate(
                        signal.contenu
                    )
                );

            } catch (error) {

                console.warn(
                    "Candidat ICE ignoré :",
                    error
                );

            }

        }

    } catch (error) {

        console.error(
            "Erreur WebRTC :",
            error
        );

    }

}


/* =========================================================
   APPELS AUDIO - LANCER UN APPEL
========================================================= */

async function lancerAppel(
    profil
) {

    if (
        !utilisateur ||
        !profil
    ) {

        return;

    }


    if (
        appelEnCours
    ) {

        alert(
            "Tu es déjà en appel."
        );

        return;

    }


    if (
        String(
            profil.id
        ) ===
        String(
            utilisateur.id
        )
    ) {

        return;

    }


    if (
        !conversationActuelle ||
        String(
            utilisateurPriveActuel &&
            utilisateurPriveActuel.id
        ) !==
        String(
            profil.id
        )
    ) {

        alert(
            "Ouvre d'abord la conversation avec cette personne."
        );

        return;

    }


    const microPret =
        await preparerMicroAppel();


    if (
        !microPret
    ) {

        return;

    }


    appelEnCours =
        true;

    appelActuelProfil =
        profil;


    const {
        data: appel,
        error
    } = await client
        .from("appels")
        .insert({

            appelant_id:
                utilisateur.id,

            appele_id:
                profil.id,

            conversation_id:
                conversationActuelle.id,

            statut:
                "sonnerie"

        })
        .select()
        .single();


    if (
        error ||
        !appel
    ) {

        console.error(error);

        alert(
            "Impossible de lancer l'appel : " +
            (
                error
                    ? error.message
                    : "erreur inconnue"
            )
        );

        nettoyerAppelLocal();

        return;

    }


    appelActuelId =
        appel.id;


    afficherFenetreAppel(
        profil.pseudo,
        "Appel en cours...",
        false
    );


    creerConnexionWebRTC();


    fluxMicroAppel
        .getTracks()
        .forEach(
            function(track) {

                peerConnectionAppel.addTrack(
                    track,
                    fluxMicroAppel
                );

            }
        );


    await creerCanalSignauxAppel(
        appelActuelId
    );


    try {

        const offre =
            await peerConnectionAppel.createOffer();


        await peerConnectionAppel.setLocalDescription(
            offre
        );


        await envoyerSignalAppel(
            "offer",
            {
                type:
                    offre.type,

                sdp:
                    offre.sdp
            }
        );


    } catch (error) {

        console.error(error);

        alert(
            "Impossible de démarrer l'appel."
        );

        await terminerAppel(
            "terminee",
            true
        );

    }

}


/* =========================================================
   APPELS AUDIO - APPEL ENTRANT
========================================================= */

async function recevoirAppelEntrant(
    appel
) {

    if (
        !utilisateur ||
        !appel
    ) {

        return;

    }


    if (
        String(
            appel.appele_id
        ) !==
        String(
            utilisateur.id
        )
    ) {

        return;

    }


    if (
        appel.statut !==
        "sonnerie"
    ) {

        return;

    }


    if (
        appelEnCours
    ) {

        /*
           Si la personne est déjà en appel,
           on refuse automatiquement le nouvel appel.
        */

        await client
            .from("appels")
            .update({
                statut:
                    "occupe"
            })
            .eq(
                "id",
                appel.id
            );

        return;

    }


    const {
        data: profil,
        error
    } = await client
        .from("profils")
        .select("id, pseudo")
        .eq(
            "id",
            appel.appelant_id
        )
        .maybeSingle();


    if (
        error ||
        !profil
    ) {

        console.error(error);

        return;

    }


    appelActuelId =
        appel.id;

    appelActuelProfil =
        profil;

    appelEnCours =
        true;


    afficherFenetreAppel(
        profil.pseudo,
        "📞 Appel entrant...",
        true
    );

}


async function accepterAppel() {

    if (
        !appelActuelId ||
        !appelActuelProfil
    ) {

        return;

    }


    const {
        data: appel,
        error
    } = await client
        .from("appels")
        .select("*")
        .eq(
            "id",
            appelActuelId
        )
        .maybeSingle();


    if (
        error ||
        !appel
    ) {

        alert(
            "Cet appel n'est plus disponible."
        );

        nettoyerAppelLocal();

        return;

    }


    const microPret =
        await preparerMicroAppel();


    if (
        !microPret
    ) {

        nettoyerAppelLocal();

        return;

    }


    const {
        data: signaux,
        error: erreurSignaux
    } = await client
        .from("signaux_appels")
        .select("*")
        .eq(
            "appel_id",
            appelActuelId
        )
        .eq(
            "type_signal",
            "offer"
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        )
        .limit(1);


    if (
        erreurSignaux ||
        !signaux ||
        signaux.length === 0
    ) {

        alert(
            "L'offre de l'appel n'est pas encore arrivée. Réessaie dans un instant."
        );

        nettoyerAppelLocal();

        return;

    }


    const offre =
        signaux[0].contenu;


    creerConnexionWebRTC();


    fluxMicroAppel
        .getTracks()
        .forEach(
            function(track) {

                peerConnectionAppel.addTrack(
                    track,
                    fluxMicroAppel
                );

            }
        );


    try {

        await peerConnectionAppel.setRemoteDescription(
            new RTCSessionDescription(
                offre
            )
        );


        await creerCanalSignauxAppel(
            appelActuelId
        );


        const reponse =
            await peerConnectionAppel.createAnswer();


        await peerConnectionAppel.setLocalDescription(
            reponse
        );


        await envoyerSignalAppel(
            "answer",
            {
                type:
                    reponse.type,

                sdp:
                    reponse.sdp
            }
        );


        await client
            .from("appels")
            .update({
                statut:
                    "acceptee"
            })
            .eq(
                "id",
                appelActuelId
            );


        afficherFenetreAppel(
            appelActuelProfil.pseudo,
            "🟢 Appel connecté",
            false
        );


    } catch (error) {

        console.error(error);

        alert(
            "Impossible d'accepter l'appel."
        );

        await terminerAppel(
            "terminee",
            true
        );

    }

}


async function refuserAppel() {

    if (
        appelActuelId
    ) {

        await client
            .from("appels")
            .update({
                statut:
                    "refusee"
            })
            .eq(
                "id",
                appelActuelId
            );

    }


    nettoyerAppelLocal();

}


/* =========================================================
   APPELS AUDIO - SURVEILLANCE DES APPELS
========================================================= */

async function initialiserEcouteAppels() {

    if (
        canalAppels
    ) {

        return;

    }


    canalAppels =
        client
            .channel(
                "appels-globaux"
            )
            .on(
                "postgres_changes",
                {

                    event: "INSERT",

                    schema: "public",

                    table: "appels"

                },
                async function(payload) {

                    if (
                        !utilisateur
                    ) {

                        return;

                    }


                    const appel =
                        payload.new;


                    if (
                        String(
                            appel.appele_id
                        ) ===
                        String(
                            utilisateur.id
                        )
                    ) {

                        await recevoirAppelEntrant(
                            appel
                        );

                    }

                }
            )
            .on(
                "postgres_changes",
                {

                    event: "UPDATE",

                    schema: "public",

                    table: "appels"

                },
                async function(payload) {

                    if (
                        !utilisateur ||
                        !appelActuelId
                    ) {

                        return;

                    }


                    if (
                        String(
                            payload.new.id
                        ) !==
                        String(
                            appelActuelId
                        )
                    ) {

                        return;

                    }


                    const statut =
                        payload.new.statut;


                    if (
                        statut === "refusee" ||
                        statut === "occupe" ||
                        statut === "terminee"
                    ) {

                        if (
                            statut !== "terminee" ||
                            appelEnCours
                        ) {

                            nettoyerAppelLocal();

                        }

                    }

                }
            )
            .subscribe();

}


/* =========================================================
   APPELS AUDIO - NETTOYAGE
========================================================= */

async function nettoyerAppelLocal() {

    fermerFenetreAppel();


    if (
        canalSignauxAppel
    ) {

        try {

            await client.removeChannel(
                canalSignauxAppel
            );

        } catch (error) {

            console.error(error);

        }

        canalSignauxAppel =
            null;

    }


    if (
        peerConnectionAppel
    ) {

        try {

            peerConnectionAppel.ontrack =
                null;

            peerConnectionAppel.onicecandidate =
                null;

            peerConnectionAppel.close();

        } catch (error) {

            console.error(error);

        }

        peerConnectionAppel =
            null;

    }


    if (
        fluxMicroAppel
    ) {

        fluxMicroAppel
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );

        fluxMicroAppel =
            null;

    }


    if (
        audioDistantAppel
    ) {

        audioDistantAppel.pause();

        audioDistantAppel.srcObject =
            null;

        audioDistantAppel.remove();

        audioDistantAppel =
            null;

    }


    appelActuelId =
        null;

    appelActuelProfil =
        null;

    appelEnCours =
        false;

}


async function terminerAppel(
    statut,
    mettreAJourServeur
) {

    const id =
        appelActuelId;


    if (
        mettreAJourServeur &&
        id
    ) {

        const {
            error
        } = await client
            .from("appels")
            .update({
                statut:
                    statut
            })
            .eq(
                "id",
                id
            );


        if (
            error
        ) {

            console.error(
                "Erreur fermeture appel :",
                error
            );

        }

    }


    await nettoyerAppelLocal();

}

document.getElementById(
    "btnDeconnexion"
).addEventListener(
    "click",
    async function() {


        fermerConversationPrivee();


        if (
            appelActuelId
        ) {

            try {

                await terminerAppel(
                    "terminee",
                    true
                );

            } catch (error) {

                console.error(error);

            }

        }


        /*
           PRESENCE
        */

        if (canalPresence) {

            try {

                await canalPresence.untrack();

            } catch (error) {

                console.error(error);

            }


            await client.removeChannel(
                canalPresence
            );

            canalPresence =
                null;

        }


        if (
            canalAppels
        ) {

            await client.removeChannel(
                canalAppels
            );

            canalAppels =
                null;

        }


        /*
           MESSAGES PUBLICS
        */

        if (canalMessages) {

            await client.removeChannel(
                canalMessages
            );

            canalMessages =
                null;

        }


        /*
           RESET
        */

        utilisateur =
            null;

        pseudoActuel =
            "";


        localStorage.removeItem(
            "compte_chat"
        );


        application.style.display =
            "none";

        connexion.style.display =
            "flex";


        inputPseudo.value =
            "";

        inputMotDePasse.value =
            "";

        inputMessage.value =
            "";


        listeMessages.innerHTML =
            "";


        afficherErreur("");

        afficherSucces("");

    }
);


/* =========================================================
   RECONNEXION AUTOMATIQUE
========================================================= */

async function verifierConnexionSauvegardee() {

    const compteSauvegarde =
        localStorage.getItem(
            "compte_chat"
        );


    if (!compteSauvegarde) {
        return;
    }


    try {

        const compte =
            JSON.parse(
                compteSauvegarde
            );


        if (
            !compte.id
        ) {

            localStorage.removeItem(
                "compte_chat"
            );

            return;

        }


        /*
           IMPORTANT :
           On utilise surtout l'ID interne.
           Le pseudo est récupéré depuis Supabase.
        */

        const {
            data: profil,
            error
        } = await client
            .from("profils")
            .select("*")
            .eq(
                "id",
                compte.id
            )
            .maybeSingle();


        if (
            error ||
            !profil
        ) {

            localStorage.removeItem(
                "compte_chat"
            );

            return;

        }


        await ouvrirApplication(
            profil
        );


    } catch (error) {

        console.error(error);

        localStorage.removeItem(
            "compte_chat"
        );

    }

}


/* =========================================================
   LANCEMENT
========================================================= */

verifierConnexionSauvegardee();

</script>
