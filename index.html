<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   VARIABLES
========================================================= */

:root {
    --primaire: #4f46e5;
    --primaire-clair: #eef2ff;
    --primaire-hover: #4338ca;

    --fond: #f5f7fb;
    --blanc: #ffffff;

    --texte: #1e293b;
    --texte-secondaire: #64748b;

    --bordure: #e2e8f0;

    --vert: #22c55e;
    --gris: #94a3b8;

    --ombre: 0 4px 20px rgba(15, 23, 42, 0.07);
}

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--fond);
    color: var(--texte);
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* =========================================================
   CONNEXION
========================================================= */

#connexion {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at top left,
            #e0e7ff,
            transparent 35%
        ),
        var(--fond);
}

.boite-connexion {
    width: 100%;
    max-width: 410px;

    padding: 35px;

    background: var(--blanc);

    border: 1px solid var(--bordure);
    border-radius: 22px;

    box-shadow: var(--ombre);

    text-align: center;
}

.logo-connexion {
    width: 72px;
    height: 72px;

    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--primaire-clair);

    border-radius: 20px;

    font-size: 36px;
}

.boite-connexion h1 {
    margin: 0;

    color: var(--texte);

    font-size: 28px;
}

.boite-connexion .sous-titre {
    margin: 10px 0 25px;

    color: var(--texte-secondaire);

    line-height: 1.5;
}

.champ {
    width: 100%;

    padding: 14px 15px;

    margin-top: 12px;

    border: 1px solid var(--bordure);
    border-radius: 12px;

    outline: none;

    font-size: 15px;

    background: #fff;

    transition: 0.2s;
}

.champ:focus {
    border-color: var(--primaire);

    box-shadow:
        0 0 0 3px rgba(79, 70, 229, 0.1);
}

.btn-principal,
.btn-secondaire {
    width: 100%;

    padding: 13px 18px;

    margin-top: 12px;

    border-radius: 12px;

    font-size: 15px;
    font-weight: bold;

    transition: 0.2s;
}

.btn-principal {
    background: var(--primaire);
    color: white;
}

.btn-principal:hover {
    background: var(--primaire-hover);
}

.btn-secondaire {
    background: var(--primaire-clair);
    color: var(--primaire);
}

.btn-secondaire:hover {
    background: #e0e7ff;
}

#erreur {
    min-height: 20px;

    margin: 15px 0 0;

    color: #dc2626;

    font-size: 14px;
}

#succes {
    min-height: 20px;

    margin: 15px 0 0;

    color: #16a34a;

    font-size: 14px;
}

/* =========================================================
   APPLICATION
========================================================= */

#application {
    display: none;

    min-height: 100vh;
}

/* =========================================================
   HEADER
========================================================= */

header {
    height: 68px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 24px;

    background: var(--blanc);

    border-bottom: 1px solid var(--bordure);
}

.logo-chat {
    display: flex;
    align-items: center;

    gap: 10px;

    font-size: 21px;
    font-weight: bold;
}

.logo-chat-icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--primaire);

    border-radius: 11px;

    color: white;
}

.btn-deconnexion {
    padding: 9px 14px;

    background: #fef2f2;

    color: #dc2626;

    border: 1px solid #fecaca;

    border-radius: 10px;

    font-weight: bold;
}

.btn-deconnexion:hover {
    background: #fee2e2;
}

/* =========================================================
   STRUCTURE
========================================================= */

.conteneur {
    display: flex;

    min-height: calc(100vh - 68px);
}

/* =========================================================
   MENU
========================================================= */

.menu {
    width: 240px;

    flex-shrink: 0;

    padding: 20px;

    background: var(--blanc);

    border-right: 1px solid var(--bordure);
}

.menu-titre {
    margin: 0 0 12px;

    color: var(--texte-secondaire);

    font-size: 12px;
    font-weight: bold;

    text-transform: uppercase;
    letter-spacing: 0.08em;
}

.menu button {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 10px;

    padding: 12px 13px;

    margin-bottom: 7px;

    background: transparent;

    color: var(--texte);

    border-radius: 11px;

    text-align: left;

    font-size: 14px;
}

.menu button:hover {
    background: var(--primaire-clair);
    color: var(--primaire);
}

.menu-separation {
    height: 1px;

    margin: 20px 0;

    background: var(--bordure);
}

.mon-compte {
    padding: 12px;

    background: #f8fafc;

    border: 1px solid var(--bordure);

    border-radius: 12px;
}

.mon-compte-label {
    margin-bottom: 5px;

    color: var(--texte-secondaire);

    font-size: 11px;
}

.mon-compte-pseudo {
    font-weight: bold;

    color: var(--primaire);

    overflow-wrap: anywhere;
}

/* =========================================================
   CONTENU
========================================================= */

.discussion {
    flex: 1;

    min-width: 0;

    display: flex;
    flex-direction: column;
}

/* =========================================================
   TITRE
========================================================= */

.titre-discussion {
    padding: 24px 28px;

    background: var(--blanc);

    border-bottom: 1px solid var(--bordure);
}

.titre-discussion h2 {
    margin: 0;

    font-size: 22px;
}

.titre-discussion p {
    margin: 6px 0 0;

    color: var(--texte-secondaire);

    font-size: 14px;
}

/* =========================================================
   ZONE PRINCIPALE
========================================================= */

#listeMessages {
    flex: 1;

    overflow-y: auto;

    padding: 25px 28px;
}

/* =========================================================
   ACCUEIL
========================================================= */

.accueil-entete {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;

    margin-bottom: 20px;
}

.accueil-entete h3 {
    margin: 0;

    font-size: 18px;
}

.compteur-connectes {
    padding: 7px 11px;

    background: #ecfdf5;

    color: #15803d;

    border-radius: 20px;

    font-size: 13px;
    font-weight: bold;
}

.grille-utilisateurs {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(260px, 1fr));

    gap: 14px;
}

.section-utilisateurs {
    margin-bottom: 28px;
}

.section-utilisateurs h3 {
    margin: 0 0 12px;

    font-size: 16px;
}

.carte-utilisateur {
    display: flex;
    align-items: center;

    gap: 12px;

    padding: 15px;

    background: var(--blanc);

    border: 1px solid var(--bordure);

    border-radius: 15px;

    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);

    transition: 0.2s;
}

.carte-utilisateur:hover {
    transform: translateY(-1px);

    box-shadow: var(--ombre);
}

.avatar-utilisateur {
    position: relative;

    width: 44px;
    height: 44px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--primaire-clair);

    color: var(--primaire);

    border-radius: 13px;

    font-size: 17px;
    font-weight: bold;
}

.point-en-ligne {
    position: absolute;

    right: -2px;
    bottom: -2px;

    width: 13px;
    height: 13px;

    background: var(--vert);

    border: 3px solid white;

    border-radius: 50%;
}

.point-hors-ligne {
    position: absolute;

    right: -2px;
    bottom: -2px;

    width: 13px;
    height: 13px;

    background: var(--gris);

    border: 3px solid white;

    border-radius: 50%;
}

.infos-utilisateur {
    min-width: 0;

    flex: 1;
}

.nom-utilisateur {
    font-weight: bold;

    overflow-wrap: anywhere;
}

.statut-utilisateur {
    margin-top: 3px;

    color: var(--texte-secondaire);

    font-size: 12px;
}

.message-vide {
    padding: 30px;

    background: var(--blanc);

    border: 1px dashed var(--bordure);

    border-radius: 14px;

    color: var(--texte-secondaire);

    text-align: center;
}

/* =========================================================
   MESSAGES
========================================================= */

.message {
    width: fit-content;

    max-width: min(75%, 700px);

    padding: 13px 15px;

    margin-bottom: 12px;

    background: var(--blanc);

    border: 1px solid var(--bordure);

    border-radius: 14px;

    box-shadow: 0 2px 5px rgba(15, 23, 42, 0.04);
}

.message .nom {
    margin-bottom: 5px;

    color: var(--primaire);

    font-weight: bold;
}

.message .texte {
    overflow-wrap: anywhere;

    line-height: 1.45;
}

.message .date {
    margin-top: 7px;

    color: #94a3b8;

    font-size: 11px;
}

/* =========================================================
   ENVOI
========================================================= */

.zone-envoi {
    display: flex;

    gap: 10px;

    padding: 15px 20px;

    background: var(--blanc);

    border-top: 1px solid var(--bordure);
}

#message {
    flex: 1;

    min-width: 0;

    margin: 0;
}

#btnEnvoyer {
    padding: 0 22px;

    background: var(--primaire);

    color: white;

    font-weight: bold;
}

#btnEnvoyer:hover {
    background: var(--primaire-hover);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 750px) {

    header {
        padding: 0 14px;
    }

    .conteneur {
        min-height: calc(100vh - 68px);
    }

    .menu {
        width: 70px;

        padding: 12px 9px;
    }

    .menu-titre,
    .menu-separation,
    .mon-compte {
        display: none;
    }

    .menu button {
        justify-content: center;

        padding: 13px 8px;

        font-size: 0;
    }

    .menu button span {
        font-size: 22px;
    }

    .titre-discussion {
        padding: 18px;
    }

    #listeMessages {
        padding: 18px;
    }

    .zone-envoi {
        padding: 12px;
    }

    #btnEnvoyer {
        padding: 0 15px;
    }

    .message {
        max-width: 90%;
    }

    .grille-utilisateurs {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 480px) {

    .boite-connexion {
        padding: 25px 20px;
    }

    .logo-chat-text {
        display: none;
    }

    .btn-deconnexion {
        font-size: 12px;
    }

    .accueil-entete {
        align-items: flex-start;

        flex-direction: column;
    }

}

/* =========================================================
   SCROLLBAR
========================================================= */

#listeMessages::-webkit-scrollbar {
    width: 8px;
}

#listeMessages::-webkit-scrollbar-thumb {
    background: #cbd5e1;

    border-radius: 10px;
}

</style>

</head>

<script>

/* =========================================================
   CONFIGURATION SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://dlzmbyvclmlgohmecuui.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_qd9EbA110P3SerFO3iq2iQ_cAgPzzGi";

const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   VARIABLES
========================================================= */

let utilisateur = null;

let pseudoActuel = "";

let canalMessages = null;

let canalPresence = null;


/* =========================================================
   ELEMENTS
========================================================= */

const connexion =
    document.getElementById("connexion");

const application =
    document.getElementById("application");

const inputPseudo =
    document.getElementById("pseudo");

const inputMotDePasse =
    document.getElementById("motDePasse");

const erreur =
    document.getElementById("erreur");

const succes =
    document.getElementById("succes");

const monPseudo =
    document.getElementById("monPseudo");

const listeMessages =
    document.getElementById("listeMessages");

const inputMessage =
    document.getElementById("message");

const btnConnexion =
    document.getElementById("btnConnexion");

const btnInscription =
    document.getElementById("btnInscription");

const btnEnvoyer =
    document.getElementById("btnEnvoyer");

const titrePage =
    document.getElementById("titrePage");

const descriptionPage =
    document.getElementById("descriptionPage");

const zoneEnvoi =
    document.querySelector(".zone-envoi");


/* =========================================================
   MESSAGES
========================================================= */

function afficherErreur(message) {

    erreur.textContent = message;

    succes.textContent = "";

}


function afficherSucces(message) {

    succes.textContent = message;

    erreur.textContent = "";

}


/* =========================================================
   VERIFICATIONS
========================================================= */

function verifierPseudo(pseudo) {

    return /^[a-zA-Z0-9_]{3,20}$/.test(pseudo);

}


function verifierCode(code) {

    return code.length >= 6;

}


/* =========================================================
   INSCRIPTION
========================================================= */

btnInscription.addEventListener(
    "click",
    inscrire
);


async function inscrire() {

    afficherErreur("");
    afficherSucces("");

    const pseudo =
        inputPseudo.value.trim();

    const code =
        inputMotDePasse.value;


    if (!verifierPseudo(pseudo)) {

        afficherErreur(
            "Le pseudo doit contenir 3 à 20 caractères : lettres, chiffres ou _."
        );

        return;
    }


    if (!verifierCode(code)) {

        afficherErreur(
            "Le code doit contenir au moins 6 caractères."
        );

        return;
    }


    btnInscription.disabled = true;

    afficherSucces(
        "Création du compte..."
    );


    const {
        data: profilExistant,
        error: erreurRecherche
    } = await client
        .from("profils")
        .select("id")
        .eq("pseudo", pseudo)
        .maybeSingle();


    if (erreurRecherche) {

        afficherErreur(
            "Erreur de vérification : " +
            erreurRecherche.message
        );

        console.error(erreurRecherche);

        btnInscription.disabled = false;

        return;
    }


    if (profilExistant) {

        afficherErreur(
            "Ce pseudo est déjà utilisé."
        );

        btnInscription.disabled = false;

        return;
    }


    const nouvelId =
        crypto.randomUUID();


    const {
        error
    } = await client
        .from("profils")
        .insert({
            id: nouvelId,
            pseudo: pseudo,
            code: code
        });


    if (error) {

        afficherErreur(
            "Erreur lors de la création : " +
            error.message
        );

        console.error(error);

        btnInscription.disabled = false;

        return;
    }


    afficherSucces(
        "Compte créé ! Tu peux maintenant te connecter."
    );


    inputMotDePasse.value = "";

    btnInscription.disabled = false;

}


/* =========================================================
   CONNEXION
========================================================= */

btnConnexion.addEventListener(
    "click",
    connecter
);


inputMotDePasse.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            connecter();
        }

    }
);


async function connecter() {

    afficherErreur("");
    afficherSucces("");

    const pseudo =
        inputPseudo.value.trim();

    const code =
        inputMotDePasse.value;


    if (!verifierPseudo(pseudo)) {

        afficherErreur(
            "Pseudo invalide."
        );

        return;
    }


    if (!code) {

        afficherErreur(
            "Entre ton code secret."
        );

        return;
    }


    btnConnexion.disabled = true;

    afficherSucces(
        "Connexion..."
    );


    const {
        data: profil,
        error
    } = await client
        .from("profils")
        .select("*")
        .eq("pseudo", pseudo)
        .eq("code", code)
        .maybeSingle();


    if (error) {

        afficherErreur(
            "Erreur de connexion : " +
            error.message
        );

        console.error(error);

        btnConnexion.disabled = false;

        return;
    }


    if (!profil) {

        afficherErreur(
            "Pseudo ou code incorrect."
        );

        btnConnexion.disabled = false;

        return;
    }


    await ouvrirApplication(profil);

    btnConnexion.disabled = false;

}


/* =========================================================
   OUVRIR APPLICATION
========================================================= */

async function ouvrirApplication(profil) {

    utilisateur = profil;

    pseudoActuel = profil.pseudo;


    localStorage.setItem(
        "compte_chat",
        JSON.stringify({
            id: profil.id,
            pseudo: profil.pseudo
        })
    );


    monPseudo.textContent =
        "@" + pseudoActuel;


    connexion.style.display =
        "none";

    application.style.display =
        "block";


    zoneEnvoi.style.display =
        "none";


    await demarrerPresence();


    afficherAccueil();

}


/* =========================================================
   PRESENCE
========================================================= */

async function demarrerPresence() {

    if (!utilisateur) {
        return;
    }


    if (canalPresence) {

        await client.removeChannel(
            canalPresence
        );

        canalPresence = null;

    }


    canalPresence =
        client.channel(
            "presence-chat",
            {
                config: {
                    presence: {
                        key: utilisateur.id
                    }
                }
            }
        );


    canalPresence.on(
        "presence",
        {
            event: "sync"
        },
        function() {

            if (
                titrePage.textContent.includes(
                    "Accueil"
                )
            ) {

                afficherUtilisateurs();

            }

        }
    );


    canalPresence.on(
        "presence",
        {
            event: "join"
        },
        function() {

            if (
                titrePage.textContent.includes(
                    "Accueil"
                )
            ) {

                afficherUtilisateurs();

            }

        }
    );


    canalPresence.on(
        "presence",
        {
            event: "leave"
        },
        function() {

            if (
                titrePage.textContent.includes(
                    "Accueil"
                )
            ) {

                afficherUtilisateurs();

            }

        }
    );


    canalPresence.subscribe(
        async function(status) {

            if (
                status === "SUBSCRIBED"
            ) {

                await canalPresence.track({

                    id: utilisateur.id,

                    pseudo: utilisateur.pseudo

                });

                afficherUtilisateurs();

            }

        }
    );

}


/* =========================================================
   UTILISATEURS
========================================================= */

async function afficherUtilisateurs() {

    if (!canalPresence) {
        return;
    }


    listeMessages.innerHTML = `
        <div class="message-vide">
            Chargement des utilisateurs...
        </div>
    `;


    const {
        data: profils,
        error
    } = await client
        .from("profils")
        .select("id, pseudo")
        .order("pseudo", {
            ascending: true
        });


    if (error) {

        console.error(error);

        listeMessages.innerHTML = `
            <div class="message-vide">
                Impossible de charger les utilisateurs.
            </div>
        `;

        return;
    }


    const presenceState =
        canalPresence.presenceState();


    const idsConnectes =
        new Set();


    Object.keys(
        presenceState
    ).forEach(function(key) {

        const presences =
            presenceState[key];


        if (
            Array.isArray(presences)
        ) {

            presences.forEach(
                function(presence) {

                    if (
                        presence.id
                    ) {

                        idsConnectes.add(
                            String(
                                presence.id
                            )
                        );

                    }

                }
            );

        }

    });


    const connectes = [];

    const deconnectes = [];


    profils.forEach(
        function(profil) {

            if (
                idsConnectes.has(
                    String(profil.id)
                )
            ) {

                connectes.push(
                    profil
                );

            } else {

                deconnectes.push(
                    profil
                );

            }

        }
    );


    listeMessages.innerHTML = "";


    /* =====================================================
       EN-TETE
    ====================================================== */

    const accueilEntete =
        document.createElement("div");

    accueilEntete.className =
        "accueil-entete";


    const titre =
        document.createElement("h3");

    titre.textContent =
        "Les utilisateurs de Chat";


    const compteur =
        document.createElement("div");

    compteur.className =
        "compteur-connectes";

    compteur.textContent =
        "🟢 " +
        connectes.length +
        " connecté" +
        (
            connectes.length > 1
                ? "s"
                : ""
        );


    accueilEntete.appendChild(
        titre
    );

    accueilEntete.appendChild(
        compteur
    );


    listeMessages.appendChild(
        accueilEntete
    );


    /* =====================================================
       SECTION CONNECTES
    ====================================================== */

    const sectionConnectes =
        document.createElement("section");

    sectionConnectes.className =
        "section-utilisateurs";


    const titreConnectes =
        document.createElement("h3");

    titreConnectes.textContent =
        "🟢 En ligne";


    const grilleConnectes =
        document.createElement("div");

    grilleConnectes.className =
        "grille-utilisateurs";


    if (
        connectes.length === 0
    ) {

        grilleConnectes.innerHTML = `
            <div class="message-vide">
                Personne n'est actuellement connecté.
            </div>
        `;

    } else {

        connectes.forEach(
            function(profil) {

                grilleConnectes.appendChild(
                    creerCarteUtilisateur(
                        profil,
                        true
                    )
                );

            }
        );

    }


    sectionConnectes.appendChild(
        titreConnectes
    );

    sectionConnectes.appendChild(
        grilleConnectes
    );


    listeMessages.appendChild(
        sectionConnectes
    );


    /* =====================================================
       SECTION HORS LIGNE
    ====================================================== */

    const sectionDeconnectes =
        document.createElement("section");

    sectionDeconnectes.className =
        "section-utilisateurs";


    const titreDeconnectes =
        document.createElement("h3");

    titreDeconnectes.textContent =
        "⚫ Hors ligne";


    const grilleDeconnectes =
        document.createElement("div");

    grilleDeconnectes.className =
        "grille-utilisateurs";


    if (
        deconnectes.length === 0
    ) {

        grilleDeconnectes.innerHTML = `
            <div class="message-vide">
                Tous les utilisateurs sont en ligne.
            </div>
        `;

    } else {

        deconnectes.forEach(
            function(profil) {

                grilleDeconnectes.appendChild(
                    creerCarteUtilisateur(
                        profil,
                        false
                    )
                );

            }
        );

    }


    sectionDeconnectes.appendChild(
        titreDeconnectes
    );

    sectionDeconnectes.appendChild(
        grilleDeconnectes
    );


    listeMessages.appendChild(
        sectionDeconnectes
    );

}


/* =========================================================
   CARTE UTILISATEUR
========================================================= */

function creerCarteUtilisateur(
    profil,
    connecte
) {

    const carte =
        document.createElement("div");

    carte.className =
        "carte-utilisateur";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar-utilisateur";


    const premiereLettre =
        profil.pseudo
            .charAt(0)
            .toUpperCase();


    avatar.textContent =
        premiereLettre;


    const point =
        document.createElement("div");


    if (connecte) {

        point.className =
            "point-en-ligne";

    } else {

        point.className =
            "point-hors-ligne";

    }


    avatar.appendChild(
        point
    );


    const infos =
        document.createElement("div");

    infos.className =
        "infos-utilisateur";


    const nom =
        document.createElement("div");

    nom.className =
        "nom-utilisateur";

    nom.textContent =
        "@" + profil.pseudo;


    const statut =
        document.createElement("div");

    statut.className =
        "statut-utilisateur";

    statut.textContent =
        connecte
            ? "En ligne"
            : "Hors ligne";


    infos.appendChild(
        nom
    );

    infos.appendChild(
        statut
    );


    carte.appendChild(
        avatar
    );

    carte.appendChild(
        infos
    );


    return carte;

}


/* =========================================================
   MESSAGES
========================================================= */

async function chargerMessages() {

    listeMessages.innerHTML = `
        <div class="message-vide">
            Chargement des messages...
        </div>
    `;


    const {
        data,
        error
    } = await client
        .from("messages")
        .select("*")
        .order("date_envoi", {
            ascending: true
        })
        .limit(100);


    if (error) {

        listeMessages.innerHTML = `
            <div class="message-vide">
                Impossible de charger les messages.
            </div>
        `;

        console.error(error);

        return;
    }


    listeMessages.innerHTML = "";


    if (
        !data ||
        data.length === 0
    ) {

        listeMessages.innerHTML = `
            <div class="message-vide">
                Aucun message pour le moment.
            </div>
        `;

        return;
    }


    data.forEach(
        afficherMessage
    );


    allerEnBas();

}


/* =========================================================
   AFFICHER MESSAGE
========================================================= */

function afficherMessage(message) {

    const bloc =
        document.createElement("div");

    bloc.className =
        "message";


    const nom =
        document.createElement("div");

    nom.className =
        "nom";

    nom.textContent =
        "@" + message.pseudo;


    const texte =
        document.createElement("div");

    texte.className =
        "texte";

    texte.textContent =
        message.contenu;


    const date =
        document.createElement("div");

    date.className =
        "date";


    if (message.date_envoi) {

        date.textContent =
            new Date(
                message.date_envoi
            ).toLocaleString(
                "fr-FR"
            );

    }


    bloc.appendChild(
        nom
    );

    bloc.appendChild(
        texte
    );

    bloc.appendChild(
        date
    );


    listeMessages.appendChild(
        bloc
    );

}


/* =========================================================
   ENVOYER MESSAGE
========================================================= */

btnEnvoyer.addEventListener(
    "click",
    envoyerMessage
);


inputMessage.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            envoyerMessage();

        }

    }
);


async function envoyerMessage() {

    const contenu =
        inputMessage.value.trim();


    if (!contenu) {
        return;
    }


    if (!utilisateur) {
        return;
    }


    btnEnvoyer.disabled = true;


    const {
        error
    } = await client
        .from("messages")
        .insert({

            utilisateur_id:
                utilisateur.id,

            pseudo:
                pseudoActuel,

            contenu:
                contenu

        });


    if (error) {

        alert(
            "Impossible d'envoyer le message : " +
            error.message
        );

        console.error(error);

    } else {

        inputMessage.value = "";

    }


    btnEnvoyer.disabled = false;

}


/* =========================================================
   TEMPS REEL MESSAGES
========================================================= */

function ecouterMessages() {

    if (canalMessages) {
        return;
    }


    canalMessages =
        client
            .channel(
                "nouveaux-messages"
            )
            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "messages"
                },
                function(payload) {

                    if (
                        titrePage.textContent.includes(
                            "Discussion"
                        )
                    ) {

                        afficherMessage(
                            payload.new
                        );

                        allerEnBas();

                    }

                }
            )
            .subscribe();

}


/* =========================================================
   DESCENDRE EN BAS
========================================================= */

function allerEnBas() {

    listeMessages.scrollTop =
        listeMessages.scrollHeight;

}


/* =========================================================
   ACCUEIL
========================================================= */

document.getElementById(
    "btnAccueil"
).addEventListener(
    "click",
    afficherAccueil
);


function afficherAccueil() {

    titrePage.textContent =
        "🏠 Accueil";

    descriptionPage.textContent =
        "Voici les personnes présentes sur Chat.";

    zoneEnvoi.style.display =
        "none";

    afficherUtilisateurs();

}


/* =========================================================
   DISCUSSION
========================================================= */

document.getElementById(
    "btnDiscussion"
).addEventListener(
    "click",
    afficherDiscussion
);


async function afficherDiscussion() {

    titrePage.textContent =
        "💬 Discussion générale";

    descriptionPage.textContent =
        "Parle avec tes potes.";

    zoneEnvoi.style.display =
        "flex";

    await chargerMessages();

    ecouterMessages();

    allerEnBas();

}


/* =========================================================
   AMIS
========================================================= */

document.getElementById(
    "btnAmis"
).addEventListener(
    "click",
    function() {

        titrePage.textContent =
            "👥 Amis";

        descriptionPage.textContent =
            "Tes amis sur Chat.";

        listeMessages.innerHTML = `
            <div class="message-vide">
                La fonctionnalité Amis sera ajoutée prochainement.
            </div>
        `;

        zoneEnvoi.style.display =
            "none";

    }
);


/* =========================================================
   DECONNEXION
========================================================= */

document.getElementById(
    "btnDeconnexion"
).addEventListener(
    "click",
    async function() {


        /* -----------------------------------------------
           PRESENCE
        ------------------------------------------------ */

        if (canalPresence) {

            try {

                await canalPresence.untrack();

            } catch (error) {

                console.error(error);

            }


            await client.removeChannel(
                canalPresence
            );

            canalPresence = null;

        }


        /* -----------------------------------------------
           MESSAGES
        ------------------------------------------------ */

        if (canalMessages) {

            await client.removeChannel(
                canalMessages
            );

            canalMessages = null;

        }


        /* -----------------------------------------------
           RESET
        ------------------------------------------------ */

        utilisateur = null;

        pseudoActuel = "";


        localStorage.removeItem(
            "compte_chat"
        );


        application.style.display =
            "none";

        connexion.style.display =
            "flex";


        inputPseudo.value = "";

        inputMotDePasse.value = "";

        inputMessage.value = "";

        listeMessages.innerHTML =
            "";


        afficherErreur("");

        afficherSucces("");

    }
);


/* =========================================================
   RECONNEXION AUTOMATIQUE
========================================================= */

async function verifierConnexionSauvegardee() {

    const compteSauvegarde =
        localStorage.getItem(
            "compte_chat"
        );


    if (!compteSauvegarde) {
        return;
    }


    try {

        const compte =
            JSON.parse(
                compteSauvegarde
            );


        if (
            !compte.id ||
            !compte.pseudo
        ) {

            return;

        }


        const {
            data: profil,
            error
        } = await client
            .from("profils")
            .select("*")
            .eq("id", compte.id)
            .eq("pseudo", compte.pseudo)
            .maybeSingle();


        if (
            error ||
            !profil
        ) {

            localStorage.removeItem(
                "compte_chat"
            );

            return;

        }


        await ouvrirApplication(
            profil
        );


    } catch (error) {

        console.error(error);

        localStorage.removeItem(
            "compte_chat"
        );

    }

}


/* =========================================================
   LANCEMENT
========================================================= */

verifierConnexionSauvegardee();

</script>
