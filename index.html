<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2ff;
    color: #222;
}

/* =========================
   ECRAN DE CONNEXION
========================= */

#connexion {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.boite-connexion {
    background: white;
    padding: 30px;
    width: 100%;
    max-width: 400px;
    border-radius: 18px;
    box-shadow: 0 8px 30px #0002;
    text-align: center;
}

.logo {
    font-size: 45px;
}

h1 {
    color: #4f46e5;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
    margin-top: 12px;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 15px;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.btn-principal {
    width: 100%;
    margin-top: 15px;
    background: #4f46e5;
    color: white;
    font-weight: bold;
}

.btn-secondaire {
    background: #e0e7ff;
    color: #3730a3;
    margin-top: 10px;
}

#erreur {
    color: #dc2626;
    margin-top: 15px;
}

#succes {
    color: #16a34a;
    margin-top: 15px;
}

/* =========================
   APPLICATION
========================= */

#application {
    display: none;
    min-height: 100vh;
}

header {
    height: 65px;
    background: #4f46e5;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
}

header h2 {
    margin: 0;
}

#btnDeconnexion {
    background: white;
    color: #4f46e5;
}

/* =========================
   STRUCTURE
========================= */

.conteneur {
    display: flex;
    height: calc(100vh - 65px);
}

/* =========================
   MENU
========================= */

.menu {
    width: 230px;
    background: white;
    padding: 20px;
    border-right: 1px solid #ddd;
}

.menu button {
    display: block;
    width: 100%;
    text-align: left;
    margin-bottom: 10px;
    background: #f1f5f9;
}

.menu button:hover {
    background: #e0e7ff;
}

.menu p {
    color: #64748b;
}

/* =========================
   DISCUSSION
========================= */

.discussion {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.titre-discussion {
    background: white;
    padding: 20px;
    border-bottom: 1px solid #ddd;
}

.titre-discussion h2 {
    margin: 0;
}

#listeMessages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

/* =========================
   MESSAGES
========================= */

.message {
    background: white;
    padding: 12px 15px;
    border-radius: 12px;
    margin-bottom: 12px;
    max-width: 75%;
    box-shadow: 0 2px 5px #0001;
}

.message .nom {
    font-weight: bold;
    color: #4f46e5;
    margin-bottom: 5px;
}

.message .texte {
    overflow-wrap: anywhere;
}

.message .date {
    font-size: 11px;
    color: #888;
    margin-top: 6px;
}

/* =========================
   ENVOI
========================= */

.zone-envoi {
    display: flex;
    gap: 10px;
    background: white;
    padding: 15px;
    border-top: 1px solid #ddd;
}

#message {
    flex: 1;
    min-width: 0;
}

#btnEnvoyer {
    background: #4f46e5;
    color: white;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 650px) {

    .menu {
        width: 70px;
        padding: 10px;
    }

    .menu button {
        font-size: 0;
        text-align: center;
    }

    .menu button::first-letter {
        font-size: 22px;
    }

    .menu p {
        display: none;
    }

    header {
        padding: 0 12px;
    }

    header h2 {
        font-size: 20px;
    }

    .message {
        max-width: 90%;
    }

}

</style>

</head>

<body>


<!-- =========================
     CONNEXION / INSCRIPTION
========================= -->

<section id="connexion">

    <div class="boite-connexion">

        <div class="logo">💬</div>

        <h1>Bienvenue sur Chat</h1>

        <p id="description">
            Connecte-toi à ton compte.
        </p>

        <input
            type="text"
            id="pseudo"
            placeholder="Ton pseudo"
            maxlength="20"
            autocomplete="username"
        >

        <input
            type="password"
            id="motDePasse"
            placeholder="Ton mot de passe"
            autocomplete="current-password"
        >

        <button
            class="btn-principal"
            id="btnConnexion"
        >
            Se connecter
        </button>

        <button
            class="btn-secondaire"
            id="btnInscription"
        >
            Créer un compte
        </button>

        <p id="erreur"></p>

        <p id="succes"></p>

    </div>

</section>


<!-- =========================
     APPLICATION
========================= -->

<section id="application">

    <header>

        <h2>💬 Chat</h2>

        <button id="btnDeconnexion">
            Se déconnecter
        </button>

    </header>


    <div class="conteneur">

        <aside class="menu">

            <p>MENU</p>

            <button id="btnAccueil">
                🏠 Accueil
            </button>

            <button id="btnDiscussion">
                💬 Discussion
            </button>

            <button id="btnAmis">
                👥 Amis
            </button>

            <p>Connecté en tant que :</p>

            <strong id="monPseudo"></strong>

        </aside>


        <main class="discussion">

            <div class="titre-discussion">

                <h2>💬 Discussion générale</h2>

                <p>Parle avec tes potes.</p>

            </div>


            <div id="listeMessages">

                <p>Chargement des messages...</p>

            </div>


            <div class="zone-envoi">

                <input
                    type="text"
                    id="message"
                    placeholder="Écris un message..."
                    maxlength="500"
                    autocomplete="off"
                >

                <button id="btnEnvoyer">
                    Envoyer
                </button>

            </div>

        </main>

    </div>

</section>


<script>

// ==========================================
// CONFIGURATION SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://dlzmbyvclmlgohmecuui.supabase.co";

const SUPABASE_KEY =
    "TA_CLE_PUBLIQUE";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ==========================================
// VARIABLES
// ==========================================

let utilisateur = null;
let pseudoActuel = "";
let canalMessages = null;


// ==========================================
// ELEMENTS HTML
// ==========================================

const connexion = document.getElementById("connexion");

const application = document.getElementById("application");

const inputPseudo = document.getElementById("pseudo");

const inputMotDePasse =
    document.getElementById("motDePasse");

const erreur = document.getElementById("erreur");

const succes = document.getElementById("succes");

const description =
    document.getElementById("description");

const monPseudo = document.getElementById("monPseudo");

const listeMessages =
    document.getElementById("listeMessages");

const inputMessage =
    document.getElementById("message");

const btnConnexion =
    document.getElementById("btnConnexion");

const btnInscription =
    document.getElementById("btnInscription");

const btnEnvoyer =
    document.getElementById("btnEnvoyer");


// ==========================================
// UTILITAIRES
// ==========================================

function afficherErreur(message) {
    erreur.textContent = message;
    succes.textContent = "";
}

function afficherSucces(message) {
    succes.textContent = message;
    erreur.textContent = "";
}

function verifierPseudo(pseudo) {

    return /^[a-zA-Z0-9_]{3,20}$/.test(pseudo);

}

function verifierMotDePasse(motDePasse) {

    return motDePasse.length >= 6;

}


// ==========================================
// CREER UNE ADRESSE INTERNE
// ==========================================

function emailInterne(pseudo) {

    return pseudo.toLowerCase() +
        "@chat-utilisateurs.local";

}


// ==========================================
// INSCRIPTION
// ==========================================

btnInscription.addEventListener(
    "click",
    inscrire
);


async function inscrire() {

    afficherErreur("");

    const pseudo = inputPseudo.value.trim();

    const motDePasse = inputMotDePasse.value;

    if (!verifierPseudo(pseudo)) {

        afficherErreur(
            "Le pseudo doit contenir 3 à 20 caractères : lettres, chiffres ou _."
        );

        return;
    }

    if (!verifierMotDePasse(motDePasse)) {

        afficherErreur(
            "Le mot de passe doit contenir au moins 6 caractères."
        );

        return;
    }

    btnInscription.disabled = true;

    const email = emailInterne(pseudo);

    // Créer le compte Supabase

    const { data, error } =
        await client.auth.signUp({
            email: email,
            password: motDePasse
        });

    if (error) {

        if (
            error.message.toLowerCase().includes("already")
        ) {

            afficherErreur(
                "Ce pseudo est déjà utilisé."
            );

        } else {

            afficherErreur(
                "Erreur : " + error.message
            );

        }

        btnInscription.disabled = false;

        return;
    }

    if (!data.user) {

        afficherErreur(
            "Impossible de créer le compte."
        );

        btnInscription.disabled = false;

        return;
    }

    // Créer le profil associé

    const { error: erreurProfil } =
        await client
            .from("profils")
            .insert({
                id: data.user.id,
                pseudo: pseudo
            });

    if (erreurProfil) {

        afficherErreur(
            "Compte créé, mais impossible de créer le profil."
        );

        btnInscription.disabled = false;

        return;
    }

    afficherSucces(
        "Compte créé ! Tu peux maintenant te connecter."
    );

    inputMotDePasse.value = "";

    btnInscription.disabled = false;

}


// ==========================================
// CONNEXION
// ==========================================

btnConnexion.addEventListener(
    "click",
    connecter
);


inputMotDePasse.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            connecter();
        }

    }
);


async function connecter() {

    afficherErreur("");

    const pseudo = inputPseudo.value.trim();

    const motDePasse = inputMotDePasse.value;

    if (!verifierPseudo(pseudo)) {

        afficherErreur(
            "Pseudo invalide."
        );

        return;
    }

    if (!motDePasse) {

        afficherErreur(
            "Entre ton mot de passe."
        );

        return;
    }

    btnConnexion.disabled = true;

    const email = emailInterne(pseudo);

    const { data, error } =
        await client.auth.signInWithPassword({
            email: email,
            password: motDePasse
        });

    if (error) {

        afficherErreur(
            "Pseudo ou mot de passe incorrect."
        );

        btnConnexion.disabled = false;

        return;
    }

    utilisateur = data.user;

    // Récupérer le profil

    const { data: profil, error: erreurProfil } =
        await client
            .from("profils")
            .select("pseudo")
            .eq("id", utilisateur.id)
            .single();

    if (erreurProfil || !profil) {

        afficherErreur(
            "Profil introuvable."
        );

        await client.auth.signOut();

        btnConnexion.disabled = false;

        return;
    }

    pseudoActuel = profil.pseudo;

    monPseudo.textContent = "@" + pseudoActuel;

    connexion.style.display = "none";

    application.style.display = "block";

    await chargerMessages();

    ecouterMessages();

    btnConnexion.disabled = false;

}


// ==========================================
// CHARGER LES MESSAGES
// ==========================================

async function chargerMessages() {

    const { data, error } =
        await client
            .from("messages")
            .select("*")
            .order("date_envoi", {
                ascending: true
            })
            .limit(100);

    if (error) {

        listeMessages.innerHTML =
            "<p>Impossible de charger les messages.</p>";

        console.error(error);

        return;
    }

    listeMessages.innerHTML = "";

    data.forEach(afficherMessage);

    allerEnBas();

}


// ==========================================
// AFFICHER UN MESSAGE
// ==========================================

function afficherMessage(message) {

    const bloc = document.createElement("div");

    bloc.className = "message";

    const nom = document.createElement("div");

    nom.className = "nom";

    nom.textContent = "@" + message.pseudo;

    const texte = document.createElement("div");

    texte.className = "texte";

    texte.textContent = message.contenu;

    const date = document.createElement("div");

    date.className = "date";

    date.textContent =
        new Date(message.date_envoi)
            .toLocaleString("fr-FR");

    bloc.appendChild(nom);

    bloc.appendChild(texte);

    bloc.appendChild(date);

    listeMessages.appendChild(bloc);

}


// ==========================================
// ENVOYER UN MESSAGE
// ==========================================

btnEnvoyer.addEventListener(
    "click",
    envoyerMessage
);


inputMessage.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            envoyerMessage();
        }

    }
);


async function envoyerMessage() {

    const contenu = inputMessage.value.trim();

    if (!contenu) {
        return;
    }

    btnEnvoyer.disabled = true;

    const { error } =
        await client
            .from("messages")
            .insert({
                utilisateur_id: utilisateur.id,
                pseudo: pseudoActuel,
                contenu: contenu
            });

    if (error) {

        alert(
            "Impossible d'envoyer le message."
        );

        console.error(error);

    } else {

        inputMessage.value = "";

    }

    btnEnvoyer.disabled = false;

}


// ==========================================
// TEMPS REEL
// ==========================================

function ecouterMessages() {

    canalMessages = client
        .channel("nouveaux-messages")
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "messages"
            },
            function(payload) {

                afficherMessage(payload.new);

                allerEnBas();

            }
        )
        .subscribe();

}


// ==========================================
// DESCENDRE EN BAS
// ==========================================

function allerEnBas() {

    listeMessages.scrollTop =
        listeMessages.scrollHeight;

}


// ==========================================
// DECONNEXION
// ==========================================

document.getElementById("btnDeconnexion")
    .addEventListener(
        "click",
        async function() {

            if (canalMessages) {

                await client.removeChannel(
                    canalMessages
                );

                canalMessages = null;

            }

            await client.auth.signOut();

            utilisateur = null;

            pseudoActuel = "";

            application.style.display = "none";

            connexion.style.display = "flex";

            inputPseudo.value = "";

            inputMotDePasse.value = "";

            inputMessage.value = "";

            listeMessages.innerHTML = "";

            btnConnexion.disabled = false;

        }
    );


// ==========================================
// MENU
// ==========================================

document.getElementById("btnAccueil")
    .addEventListener(
        "click",
        function() {

            alert("Bienvenue sur Chat !");

        }
    );


document.getElementById("btnDiscussion")
    .addEventListener(
        "click",
        function() {

            alert(
                "Tu es déjà dans la discussion générale."
            );

        }
    );


document.getElementById("btnAmis")
    .addEventListener(
        "click",
        function() {

            alert(
                "La fonctionnalité Amis sera ajoutée prochainement."
            );

        }
    );

</script>

</body>
</html>
